<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Duck Guess - Timer Widget</title>
    <style>
        /* Sunny Pond Color Palette */
        :root {
            --teal-dark: #2e7d32;
            --teal-light: #81c784;
            --yellow: #fbc02d;
            --orange: #ee9b00;
            --red: #ae2012;
            --circle-size: 200px;
        }

        body {
            background-color: transparent; /* Transparent for OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            color: var(--yellow);
        }

        /* Timer Container */
        .timer-widget {
            position: relative;
            width: var(--circle-size);
            height: var(--circle-size);
            background: linear-gradient(135deg, var(--teal-dark), var(--teal-light));
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 8px solid #5d4037;
            transition: all 0.3s ease;
        }

        /* Stopwatch Button Pseudo-element */
        .timer-widget.state-stopwatch::before {
            content: "";
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 16px;
            background: #9e9e9e;
            border: 4px solid #424242;
            border-radius: 4px 4px 0 0;
            z-index: 5;
        }

        /* SVG Progress Ring (Hidden by default until <= 60s) */
        .progress-ring {
            position: absolute;
            top: -8px; /* Offset adjusted for the thicker border */
            left: -8px;
            width: calc(100% + 16px);
            height: calc(100% + 16px);
            transform: rotate(-90deg);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .progress-ring.visible {
            opacity: 1;
        }

        .progress-ring__track {
            fill: transparent;
            stroke: rgba(0, 0, 0, 0.2);
            stroke-width: 8;
        }

        .progress-ring__circle {
            fill: transparent;
            stroke: var(--orange);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }

        /* Time Display Text */
        .time-display {
            font-weight: 800;
            text-align: center;
            line-height: 1;
            z-index: 10;
            transition: color 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* State: Standard ( > 60 seconds) */
        .state-standard .time-display {
            font-size: 3rem; /* text-4xl equivalent to fit MM:SS */
            letter-spacing: 2px;
        }

        /* State: Stopwatch ( <= 60 seconds) */
        .state-stopwatch .time-display {
            font-size: 5rem; /* Massive text for seconds only */
        }

        .secs-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            margin-top: -5px;
            font-weight: bold;
            z-index: 10;
        }

        .state-stopwatch .secs-label {
            opacity: 0.8;
        }

        /* State: Danger ( <= 10 seconds) */
        .state-danger .progress-ring__circle {
            stroke: var(--red);
        }

        .state-danger .time-display,
        .state-danger .secs-label {
            color: var(--red);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .state-danger {
            animation: pulse 1s infinite;
        }

        /* Simulation Control Panel (Hidden in standard OBS dimensions) */
        #control-panel {
            margin-top: 50px;
            background: var(--teal-dark);
            padding: 15px;
            border-radius: 8px;
            color: var(--yellow);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            border: 2px solid var(--teal-light);
        }
        #control-panel button {
            background: var(--orange);
            color: var(--teal-dark);
            font-weight: bold;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        #control-panel button:hover {
            background: var(--yellow);
            transform: scale(1.05);
        }
        #control-panel input {
            padding: 5px;
            width: 60px;
            text-align: center;
            background: var(--teal-light);
            border: 1px solid var(--yellow);
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="timer-widget state-standard" id="timerWidget">
        <svg class="progress-ring" id="progressRing">
            <circle class="progress-ring__track" cx="104" cy="104" r="96"></circle>
            <circle class="progress-ring__circle" id="ringCircle" cx="104" cy="104" r="96"></circle>
        </svg>
        <div class="time-display" id="timeDisplay">00:00</div>
        <div class="secs-label" id="secsLabel">SECS</div>
    </div>

    <!-- Hidden in OBS Control Panel -->
    <div id="control-panel">
        <strong>Simulation Panel (Hides in OBS)</strong><br><br>
        <label>Minutes:</label>
        <input type="number" id="simMinutes" value="2" min="1"><br>
        <button onclick="startSimulation()">Start Game (Set Secret Word)</button>
        <button onclick="resetTimer()">Stop/Reset</button>
        <button onclick="document.getElementById('control-panel').style.display='none'">Hide Panel</button>
    </div>

    <script>
        // --- Timer Logic ---
        const timerWidget = document.getElementById('timerWidget');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressRing = document.getElementById('progressRing');
        const ringCircle = document.getElementById('ringCircle');

        let timerInterval;
        let timeRemaining = 0;
        let totalSeconds = 0;

        let currentTimerStatus = "stopped";
        let currentTimerDuration = 2;
        let currentTimerAvatarWinner = "";
        let currentGameState = "inactive";
        let currentWinner = "";
        let ws;
        let pollInterval;
        const REQUEST_ID = 'duck-timer';

        // --- AUDIO LOGIC ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTimeout() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sawtooth';

                const now = audioCtx.currentTime;

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.0);

                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 1.0);

                osc.start(now);
                osc.stop(now + 1.0);
            } catch(e) {
                console.warn("Audio play error", e);
            }
        }

        // Setup SVG Circle for Progress Ring
        const radius = ringCircle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        ringCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        ringCircle.style.strokeDashoffset = circumference;

        function updateTimerAvatar(state, winner) {
            const safeState = state ? String(state).trim().toLowerCase() : "inactive";
            const safeWinner = winner ? String(winner).trim() : "";

            if (safeState === "recap" && safeWinner && safeWinner.toLowerCase() !== "time's up" && !safeWinner.toLowerCase().includes("forfeited")) {
                if (currentTimerAvatarWinner !== safeWinner) {
                    currentTimerAvatarWinner = safeWinner;
                    fetch(`https://decapi.me/twitch/avatar/${safeWinner}`)
                        .then((res) => res.text())
                        .then((url) => {
                            if (url && url.startsWith("http")) {
                                timerWidget.style.background = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${url}')`;
                                timerWidget.style.backgroundSize = "cover";
                                timerWidget.style.backgroundPosition = "center";
                            }
                        })
                        .catch((err) => console.error("Error fetching avatar for timer:", err));
                }
            } else {
                if (currentTimerAvatarWinner !== "") {
                    currentTimerAvatarWinner = "";
                    timerWidget.style.background = "";
                    if (timeRemaining <= 60 && timeRemaining > 0) {
                        const hue = (timeRemaining / 60) * 140;
                        timerWidget.style.background = `linear-gradient(135deg, hsl(${hue}, 80%, 30%), hsl(${hue}, 80%, 50%))`;
                    }
                }
            }
        }

        function setProgress(percent) {
            const offset = circumference - percent / 100 * circumference;
            ringCircle.style.strokeDashoffset = offset;
        }

        function updateTimerDisplay() {
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                timeDisplay.innerText = "TIME'S UP!";
                timeDisplay.style.fontSize = "2.5rem";
                const secsLabel = document.getElementById('secsLabel');
                if (secsLabel) secsLabel.style.opacity = '0';
                setProgress(0);
                // Notify Streamer.bot that time is up
                sendToStreamerBot("timedout");
                playTimeout();
                return;
            }

            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;

            if (timeRemaining > 60) {
                // > 1 Minute: Standard Mode (MM:SS)
                timerWidget.className = 'timer-widget state-standard';
                timerWidget.style.background = "";
                timeDisplay.style.fontSize = "";
                const secsLabel = document.getElementById('secsLabel');
                if (secsLabel) secsLabel.style.opacity = '';
                progressRing.classList.remove('visible');
                timeDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                // <= 1 Minute: Stopwatch Mode (SS)
                progressRing.classList.add('visible');
                timeDisplay.innerText = seconds.toString().padStart(2, '0');
                timeDisplay.style.fontSize = "";
                const secsLabel = document.getElementById('secsLabel');
                if (secsLabel) secsLabel.style.opacity = '';

                const hue = (timeRemaining / 60) * 140;
                timerWidget.style.background = `linear-gradient(135deg, hsl(${hue}, 80%, 30%), hsl(${hue}, 80%, 50%))`;

                // Calculate percentage based on 60 seconds total for the ring
                const percent = (timeRemaining / 60) * 100;
                setProgress(percent);

                if (timeRemaining <= 10) {
                    timerWidget.className = 'timer-widget state-stopwatch state-danger';
                } else {
                    timerWidget.className = 'timer-widget state-stopwatch';
                }
            }
        }

        function startTimer(durationMinutes) {
            clearInterval(timerInterval);
            totalSeconds = durationMinutes * 60;
            timeRemaining = totalSeconds;

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function resetTimer(durationMinutes = 0) {
            clearInterval(timerInterval);
            timeRemaining = durationMinutes * 60;
            currentTimerAvatarWinner = "";
            timerWidget.className = 'timer-widget state-standard';
            timerWidget.style.background = "";
            timeDisplay.style.fontSize = "";
            progressRing.classList.remove('visible');
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timeDisplay.innerText = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        }

        // --- Streamer.bot WebSocket Logic ---
        function requestGlobals() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(
                    JSON.stringify({
                        request: "GetGlobals",
                        id: REQUEST_ID + "_persisted",
                        persisted: true,
                    })
                );
            }
        }

        function getVarValue(v) {
            if (v == null) return null;
            if (typeof v === 'object' && v !== null && 'value' in v) return v.value;
            return v;
        }

        function processVariables(variablesObj) {
            let newTimerStatus = currentTimerStatus;
            let newTimerDuration = currentTimerDuration;

            let tsVal = getVarValue(variablesObj['guessing-game_timerStatus']);
            if (tsVal != null) {
                newTimerStatus = String(tsVal).trim().toLowerCase();
            }
            let tdVal = getVarValue(variablesObj['guessing-game_timerDuration']);
            if (tdVal != null) {
                newTimerDuration = parseInt(tdVal) || 2;
            }

            let durationChanged = newTimerDuration !== currentTimerDuration;

            if (newTimerStatus !== currentTimerStatus || durationChanged) {
                if (newTimerStatus === "running" && currentTimerStatus !== "running") {
                    startTimer(newTimerDuration);
                } else if (newTimerStatus === "stopped" && currentTimerStatus !== "stopped") {
                    stopTimer();
                }
                currentTimerStatus = newTimerStatus;
                currentTimerDuration = newTimerDuration;
            }

            let previousGameState = currentGameState;
            let stateVal = getVarValue(variablesObj['guessing-game_state']);
            if (stateVal != null) {
                currentGameState = String(stateVal).trim().toLowerCase();
            }

            if (currentGameState === "inactive") {
                timerWidget.style.display = 'none';
            } else {
                timerWidget.style.display = '';
            }

            if ((currentGameState === "waiting" && previousGameState !== "waiting") ||
                (currentGameState === "waiting" && durationChanged)) {
                resetTimer(newTimerDuration);
            }

            let winVal = getVarValue(variablesObj['guessing-game_winner']);
            if (winVal != null) {
                currentWinner = String(winVal).trim();
            } else if (currentGameState !== "recap") {
                currentWinner = "";
            }

            updateTimerAvatar(currentGameState, currentWinner);
        }

        function connectStreamerBot() {
            try {
                ws = new WebSocket('ws://127.0.0.1:8080/');

                ws.onopen = () => {
                    console.log("Connected to Streamer.bot (Timer)");
                    // Subscribe to global variable changes
                    ws.send(JSON.stringify({
                        request: 'Subscribe',
                        events: { general: ['Custom'] }, // Adjust based on how you broadcast variable changes
                        id: 'duck-timer-listener'
                    }));

                    requestGlobals();
                    pollInterval = setInterval(requestGlobals, 1000);
                };

                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);

                    if (
                        msg.id === REQUEST_ID + "_persisted" &&
                        msg.variables
                    ) {
                        processVariables(msg.variables);
                    }

                    // Listen for the secret word being set to trigger the start
                    if (msg.event?.source === 'General' && msg.event?.type === 'Custom' && msg.data?.name === 'GameStart') {
                        // Assuming you pass guessing-game_timerDuration as an argument in a Custom Event named 'GameStart'
                        const duration = msg.data.arguments['guessing-game_timerDuration'] || 2; // Default 2 mins
                        const secretWord = msg.data.arguments['guessing-game_secretWord'];

                        if (secretWord && secretWord.trim() !== "") {
                            startTimer(parseInt(duration));
                        }
                    }

                    // Listen for manual stop/reset
                    if (msg.event?.source === 'General' && msg.event?.type === 'Custom' && msg.data?.name === 'GameStop') {
                        resetTimer();
                    }
                };

                ws.onclose = () => {
                    console.log("Disconnected from Streamer.bot (Timer). Reconnecting...");
                    clearInterval(pollInterval);
                    setTimeout(connectStreamerBot, 5000);
                };

                ws.onerror = (error) => {
                    ws.close();
                };
            } catch (e) {
                console.warn("Streamer.bot WS not found. Running in simulation mode.");
            }
        }

        // Function to push state back to Streamer.bot
        function sendToStreamerBot(status) {
            try {
                const ws = new WebSocket('ws://127.0.0.1:8080/');
                ws.onopen = () => {
                    ws.send(JSON.stringify({
                        request: 'DoAction',
                        action: {
                            // You would create an action in SB called "Timer Finished" that sets guessing-game_timerStatus to "timedout"
                            name: 'Timer Finished'
                        },
                        id: 'timer-finished-trigger'
                    }));
                    ws.close();
                };
            } catch (e) {
                console.log(`[Simulated] Action triggered: Timer Finished. Status set to: ${status}`);
            }
        }

        // Initialize connection
        connectStreamerBot();

        // --- Simulation Panel Functions ---
        function startSimulation() {
            const mins = document.getElementById('simMinutes').value;
            startTimer(mins);
        }
    </script>
</body>
</html>
