<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game Leaderboard</title>
    <style>
        :root {
            /* Sunny Pond Palette */
            --cyan-light: #ecfeff;
            --cyan: #06b6d4;
            --teal-bright: #2dd4bf;
            --teal-dark: #115e59;
            --yellow: #facc15;
            --orange: #ea580c;
            --cyan-neon: #43d9f2;
            --red-accent: #f24343;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent; /* Essential for OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--cyan-light);
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 20px;
        }

        /* Leaderboard Widget Container */
        .leaderboard-widget {
            background: rgba(24, 24, 27, 0.9); /* Same background color as Twitch dark mode */
            border: 4px solid var(--cyan);
            border-radius: 16px;
            min-width: 300px;
            margin: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        /* Header */
        .header {
            background: transparent;
            padding: 10px 15px 5px 15px;
            text-align: center;
        }

        .header h2 {
            color: var(--cyan-light);
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Leaderboard List */
        .list-container {
            padding: 5px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 80px;
            overflow-y: hidden;
            flex: 1;
        }

        /* Individual Rows */
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .username {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--cyan-light);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--cyan);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .score-value {
            color: var(--cyan-light);
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
        }

        .podium-spot {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex: 1;
            flex-basis: 0;
        }

        .podium-spot.first {
            order: 2;
            z-index: 3;
            transform: translateY(-30px);
        }

        .podium-spot.second {
            order: 1;
            z-index: 2;
        }

        .podium-spot.third {
            order: 3;
            z-index: 1;
        }

        .podium-spot .avatar-container {
            position: relative;
            margin-bottom: 15px;
        }

        .podium-spot .avatar {
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--cyan);
            background-color: rgba(0, 0, 0, 0.5);
            display: block;
        }

        .podium-spot.first .avatar {
            width: 140px;
            height: 140px;
            border-color: #ffd700; /* Gold */
        }

        .podium-spot.second .avatar {
            width: 100px;
            height: 100px;
            border-color: #c0c0c0; /* Silver */
        }

        .podium-spot.third .avatar {
            width: 100px;
            height: 100px;
            border-color: #cd7f32; /* Bronze */
        }

        .podium-spot .ribbon {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            white-space: nowrap;
            border: 2px solid rgba(0,0,0,0.2);
        }

        .podium-spot.first .ribbon {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            font-size: 1.1rem;
        }

        .podium-spot.second .ribbon {
            background: linear-gradient(135deg, #c0c0c0, #808080);
        }

        .podium-spot.third .ribbon {
            background: linear-gradient(135deg, #cd7f32, #8b4513);
        }

        .podium-spot .username {
            font-weight: 900;
            font-size: 1.4rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            text-align: center;
            margin-top: 5px;
        }

        .podium-spot.first .username {
            font-size: 1.8rem;
        }

        .podium-spot .score {
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            color: #fff;
            margin-top: 2px;
        }


        /* Empty state */
        .empty-state {
            text-align: center;
            color: var(--cyan-light);
            opacity: 0.7;
            font-style: italic;
            padding: 20px 0;
            font-size: 1rem;
        }

        /* Hidden Simulation Panel - Hide in OBS with CSS */
        #control-panel {
            background: var(--cyan-light);
            padding: 15px;
            border-radius: 10px;
            color: #333;
            font-size: 14px;
            border: 2px solid var(--orange);
            min-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sim-header {
            font-weight: bold;
            color: var(--teal-dark);
            text-align: center;
            margin-bottom: 5px;
        }

        button {
            background: var(--orange);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background: var(--teal-bright);
            color: var(--teal-dark);
        }

        /* Connection indicator */
        #connection-status {
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
        }
        .connected { color: var(--teal-dark); }
        .disconnected { color: var(--red-accent); }

    </style>
</head>
<body>

    <div class="leaderboard-widget">
        <!-- Podium (Above Leaderboard) -->
        <div class="podium-container" id="podium-container" style="display: none;">
            <!-- 2nd Place -->
            <div class="podium-spot second" id="spot-2" style="display: none;">
                <div class="avatar-container">
                    <img class="avatar" src="" alt="2nd Place">
                    <div class="ribbon">2nd Place</div>
                </div>
                <div class="username" id="user-2"></div>
                <div class="score" id="score-2"></div>
            </div>

            <!-- 1st Place -->
            <div class="podium-spot first" id="spot-1" style="display: none;">
                <div class="avatar-container">
                    <img class="avatar" src="" alt="1st Place">
                    <div class="ribbon">1st Place</div>
                </div>
                <div class="username" id="user-1"></div>
                <div class="score" id="score-1"></div>
            </div>

            <!-- 3rd Place -->
            <div class="podium-spot third" id="spot-3" style="display: none;">
                <div class="avatar-container">
                    <img class="avatar" src="" alt="3rd Place">
                    <div class="ribbon">3rd Place</div>
                </div>
                <div class="username" id="user-3"></div>
                <div class="score" id="score-3"></div>
            </div>
        </div>

        <div class="header">
            <h2>SCORES</h2>
        </div>
        <div class="list-container" id="leaderboard-list">
            <div class="empty-state">Waiting for scores...</div>
        </div>
    </div>

    <!-- Simulation Panel for Browser Testing -->
    <div id="control-panel">
        <div class="sim-header">Browser Simulation Panel</div>
        <div id="connection-status" class="disconnected">WS Disconnected</div>
        <button onclick="startMockPreview()">Simulate Live Data</button>
        <div style="font-size: 0.7rem; text-align: center; opacity: 0.8; margin-top: 5px;">
            Hide in OBS Custom CSS: <br> <code>#control-panel { display: none !important; }</code>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const WS_URL = 'ws://127.0.0.1:8080/';
        const POLL_INTERVAL_MS = 2000; // Poll every 2 seconds
        const REQUEST_ID = 'guessing_game_leaderboard_poll';

        // The name of the global variable containing the bundled JSON object of scores
        const VAR_SCORES = 'guessing-game_leaderboard';
        // ---------------------

        let ws;
        let pollInterval;
        let currentScoresString = ""; // Cache to prevent unnecessary DOM updates
        let mockIntervalActive = false;

        const listContainer = document.getElementById('leaderboard-list');
        const connStatus = document.getElementById('connection-status');

        function connect() {
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    connStatus.textContent = 'Connected to Streamer.bot';
                    connStatus.className = 'connected';
                    requestGlobals();
                    pollInterval = setInterval(requestGlobals, POLL_INTERVAL_MS);
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    // Listen for both our persisted and non-persisted requests
                    if (data.id === REQUEST_ID + '_persisted' && data.variables) {
                        processScores(data.variables);
                    }
                };

                ws.onclose = () => {
                    connStatus.textContent = 'Disconnected';
                    connStatus.className = 'disconnected';
                    clearInterval(pollInterval);
                    // Don't auto-reconnect if they are using the simulation panel
                    if (!mockIntervalActive) {
                        setTimeout(connect, 5000);
                    }
                };

                ws.onerror = (error) => {
                    // This catches the asynchronous connection refused error when not in OBS
                    ws.close();
                };
            } catch (error) {
                console.warn("WebSocket creation failed.");
            }
        }

        function requestGlobals() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ request: "GetGlobals", id: REQUEST_ID + '_persisted', persisted: true }));
            }
        }

        function updateSpot(spotElement, player) {
            if (!player) {
                spotElement.style.display = 'none';
                return;
            }
            spotElement.style.display = 'flex';
            const avatar = spotElement.querySelector('.avatar');
            const username = spotElement.querySelector('.username');
            const score = spotElement.querySelector('.score');

            username.textContent = player.user;
            username.style.color = player.color || '#fff';
            score.textContent = player.score + " pts";

            fetch(`https://decapi.me/twitch/avatar/${player.user}`)
                .then(response => response.text())
                .then(url => {
                    if (url && url.startsWith('http')) {
                        avatar.src = url;
                    } else {
                        avatar.src = 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-300x300.png';
                    }
                })
                .catch(() => {
                    avatar.src = 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-300x300.png';
                });
        }

        function renderTop3(scoresArray) {
            const podiumContainer = document.getElementById('podium-container');

            if (!scoresArray || scoresArray.length === 0) {
                podiumContainer.style.display = 'none';
                return;
            }

            podiumContainer.style.display = 'flex';

            const spot1 = document.getElementById('spot-1');
            const spot2 = document.getElementById('spot-2');
            const spot3 = document.getElementById('spot-3');

            updateSpot(spot1, scoresArray[0]);
            updateSpot(spot2, scoresArray.length > 1 ? scoresArray[1] : null);
            updateSpot(spot3, scoresArray.length > 2 ? scoresArray[2] : null);
        }

        function processScores(variablesObj) {
            if (variablesObj["guessing-game_leaderboardScrollSpeedMultiplier"] && variablesObj["guessing-game_leaderboardScrollSpeedMultiplier"].value != null) {
                configLeaderboardScrollSpeedMultiplier = parseFloat(variablesObj["guessing-game_leaderboardScrollSpeedMultiplier"].value) || 1.0;
            }
            if (variablesObj["guessing-game_leaderboardScrollGapPx"] && variablesObj["guessing-game_leaderboardScrollGapPx"].value != null) {
                configLeaderboardScrollGapPx = parseInt(variablesObj["guessing-game_leaderboardScrollGapPx"].value) || 50;
            }

            if (!variablesObj[VAR_SCORES] || variablesObj[VAR_SCORES].value == null) return;

            const rawValue = variablesObj[VAR_SCORES].value;
            const stringifiedValue = typeof rawValue === 'object' ? JSON.stringify(rawValue) : String(rawValue);

            if (stringifiedValue === currentScoresString) return;
            currentScoresString = stringifiedValue;

            let parsedData = {};
            try {
                if (typeof rawValue === 'object') {
                    parsedData = rawValue;
                } else {
                    parsedData = JSON.parse(rawValue);
                    if (typeof parsedData === 'string') parsedData = JSON.parse(parsedData);
                }
            } catch (e) {
                console.error("Failed to parse scores JSON:", e);
                return;
            }

            let scoresArray = [];
            if (Array.isArray(parsedData)) {
                scoresArray = parsedData.map(item => ({ user: item.username, score: parseInt(item.score) || 0, color: item.color }));
            } else {
                for (const [user, score] of Object.entries(parsedData)) {
                    scoresArray.push({ user: user, score: parseInt(score) || 0 });
                }
            }

            scoresArray.sort((a, b) => b.score - a.score);
            renderLeaderboard(scoresArray);
            renderTop3(scoresArray);
        }


        let autoScrollFrame;
        let lastScrollTime = 0;
        let configLeaderboardScrollSpeedMultiplier = 1.0;
        let configLeaderboardScrollGapPx = 50;
        let leaderboardOriginalHeight = 0;


        function startLeaderboardScroll() {
            const container = document.getElementById("leaderboard-list");
            if (!container) return;

            if (autoScrollFrame) cancelAnimationFrame(autoScrollFrame);
            container.scrollTop = 0;

            let scrollPos = 0;

            function step() {
                const now = Date.now();
                if (lastScrollTime === 0) lastScrollTime = now;
                const dt = now - lastScrollTime;

                if (leaderboardOriginalHeight > container.clientHeight) {
                    scrollPos += 0.05 * configLeaderboardScrollSpeedMultiplier * dt;

                    if (scrollPos >= leaderboardOriginalHeight + configLeaderboardScrollGapPx + 12) {
                        scrollPos = scrollPos % (leaderboardOriginalHeight + configLeaderboardScrollGapPx + 12);
                    }
                    container.scrollTop = scrollPos;
                } else {
                    scrollPos = 0;
                    container.scrollTop = 0;
                }

                lastScrollTime = now;
                autoScrollFrame = requestAnimationFrame(step);
            }

            lastScrollTime = Date.now();
            autoScrollFrame = requestAnimationFrame(step);
        }

        function renderLeaderboard(scoresArray) {
            listContainer.innerHTML = '';

            if (scoresArray.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">Let\'s play Duck Duck Guess!<br><br>For rules, type !ddgrules in chat.</div>';

                const header = document.querySelector('.leaderboard-widget .header');
                if (header) {
                    header.style.display = '';
                    const h2 = header.querySelector('h2');
                    if (h2) h2.textContent = 'RULES';
                }

                return;
            }

            const header = document.querySelector('.leaderboard-widget .header');
            if (header) {
                header.style.display = '';
                const h2 = header.querySelector('h2');
                if (h2) h2.textContent = 'SCORES';
            }

            const originalWrapper = document.createElement("div");
            originalWrapper.className = "leaderboard-wrapper-original";

            scoresArray.forEach((player, index) => {
                const rank = index + 1;
                const row = document.createElement('div');
                row.className = `score-row`;

                let colorStyle = "";
                if (player.color) {
                    colorStyle = `style="color: ${player.color};"`;
                }

                row.innerHTML = `
                    <div class="username">
                        <span style="opacity: 0.6; font-size: 0.9em; margin-right: 4px;">#${rank}</span>
                        <img class="avatar" src="" alt="avatar" style="display: none;">
                        <span ${colorStyle}>${player.user}</span>
                    </div>
                    <div class="score-value">${player.score}</div>
                `;

                originalWrapper.appendChild(row);

                // Fetch avatar
                fetch(`https://decapi.me/twitch/avatar/${player.user}`)
                  .then((res) => res.text())
                  .then((url) => {
                    if (url && url.startsWith("http")) {
                      const img = row.querySelector(".avatar");
                      if (img) {
                        img.src = url;
                        img.style.display = "inline-block";
                      }

                      // Also update the clone if it exists
                      const clones = document.querySelectorAll(".leaderboard-wrapper-clone .score-row");
                      if (clones && clones[index]) {
                          const cloneImg = clones[index].querySelector(".avatar");
                          if (cloneImg) {
                              cloneImg.src = url;
                              cloneImg.style.display = "inline-block";
                          }
                      }
                    } else {
                      const img = row.querySelector(".avatar");
                      if (img) {
                        img.src = 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-300x300.png';
                        img.style.display = "inline-block";
                      }
                      const clones = document.querySelectorAll(".leaderboard-wrapper-clone .score-row");
                      if (clones && clones[index]) {
                          const cloneImg = clones[index].querySelector(".avatar");
                          if (cloneImg) {
                              cloneImg.src = 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-300x300.png';
                              cloneImg.style.display = "inline-block";
                          }
                      }
                    }
                  })
                  .catch((err) => {
                      console.error("Error fetching avatar:", err);
                      const img = row.querySelector(".avatar");
                      if (img) {
                        img.src = 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-300x300.png';
                        img.style.display = "inline-block";
                      }
                      const clones = document.querySelectorAll(".leaderboard-wrapper-clone .score-row");
                      if (clones && clones[index]) {
                          const cloneImg = clones[index].querySelector(".avatar");
                          if (cloneImg) {
                              cloneImg.src = 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-300x300.png';
                              cloneImg.style.display = "inline-block";
                          }
                      }
                  });
            });

            listContainer.appendChild(originalWrapper);
            leaderboardOriginalHeight = originalWrapper.scrollHeight;

            if (leaderboardOriginalHeight > listContainer.clientHeight) {
                const gapDiv = document.createElement("div");
                gapDiv.style.height = `${configLeaderboardScrollGapPx}px`;
                gapDiv.style.flexShrink = "0";
                listContainer.appendChild(gapDiv);

                const cloneWrapper = originalWrapper.cloneNode(true);
                cloneWrapper.className = "leaderboard-wrapper-clone";
                listContainer.appendChild(cloneWrapper);
            }

            startLeaderboardScroll();
        }

        function startMockPreview() {
            if (mockIntervalActive) return; // Prevent multiple intervals
            mockIntervalActive = true;

            connStatus.textContent = 'Simulation Mode Active';
            connStatus.className = 'connected';

            // Disconnect websocket so it stops trying to reconnect
            if (ws) { ws.onclose = null; ws.close(); }

            let mockScores = [
                { username: "MegaDuck", score: 1250 },
                { username: "GooseMaster", score: 980 },
                { username: "QuackAttaque", score: 850 },
                { username: "BreadCrumbz", score: 720 },
                { username: "SirFeathers", score: 600 },
                { username: "PondSkater", score: 150 }
            ];

            let variablesObj = {};
            variablesObj[VAR_SCORES] = { value: JSON.stringify(mockScores) };
            processScores(variablesObj);

            setInterval(() => {
                const randomIdx = Math.floor(Math.random() * mockScores.length);
                mockScores[randomIdx].score += Math.floor(Math.random() * 200) + 50;
                variablesObj[VAR_SCORES] = { value: JSON.stringify(mockScores) };
                processScores(variablesObj);
            }, 3000);
        }

        // Start connection on load
        connect();
    </script>
</body>
</html>
