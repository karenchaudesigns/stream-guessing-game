<!DOCTYPE html>
<html>
<body>
<script>
function playSoundEffect(state) {
    const audio = new Audio(`${state}.mp3`);
    audio.addEventListener('canplaythrough', () => {
        console.log("canplaythrough fired for", state);
        audio.play().catch(e => console.log("play error", e));
    });
    audio.addEventListener('error', (e) => {
        console.log("fallback for", state);
    });
}
playSoundEffect("missing");
</script>
</body>
</html>
