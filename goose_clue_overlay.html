<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goose Clue Overlay</title>
    <style>
        :root {
            /* Sunny Pond Palette */
            --cyan-light: #ecfeff;
            --cyan: #06b6d4;
            --teal-bright: #2dd4bf;
            --teal-dark: #115e59;
            --yellow: #facc15;
            --orange: #ea580c;
            --cyan-neon: #43d9f2;
            --red-accent: #f24343;
        }

        body {
            background-color: transparent; /* Transparent for OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px; /* Leave room for stylus to clear top edge */
        }

        .clue-widget {
            position: relative;
            background: transparent; /* Inside is fully transparent */
            border: 12px solid #1a1a1a; /* iPad Bezel */
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 600px;
            min-height: 350px;
            display: flex;
            flex-direction: column;

            /* Entrance Animation */
            animation: bounceIn 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: translateY(50px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .sender-label {
            position: absolute;
            top: -45px; /* Docked right above the top bezel without overlapping */
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 40%, #ffffff 100%);
            color: var(--teal-dark);
            padding: 5px 25px 5px 15px;
            border-radius: 4px 50px 50px 4px / 4px 50% 50% 4px; /* Flatter back left, sharp tapered nib right */
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow:
                inset 0 -2px 5px rgba(0,0,0,0.2),
                inset 0 2px 5px rgba(255,255,255,0.8),
                0 5px 10px rgba(0,0,0,0.3);
            border-left: 8px solid #ccc; /* Silver band detail */
            white-space: nowrap;
            width: 450px; /* Long enough to fit max length Twitch usernames */
            height: 35px; /* Fixed height so shape doesn't change when empty */
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            letter-spacing: 1px;
            z-index: 10;
        }

        .goose-avatar {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            margin-right: 10px;
            display: none;
            vertical-align: middle;
        }

        .clue-title {
            background: rgba(17, 94, 89, 0.95); /* Deep Teal for Inactive */
            color: #ffffff; /* White text for Inactive */
            font-size: 1.2rem;
            font-weight: 800;
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid var(--teal-dark);
            border-radius: 12px 12px 0 0;
            letter-spacing: 1px;
            text-shadow: none;
            transition: all 0.3s ease;
        }

        .clue-title.waiting {
            background: var(--yellow);
            color: var(--teal-dark);
            text-shadow: none;
        }

        .clue-title.active {
            background: var(--orange);
            color: var(--cyan-light);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        .clue-text {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.2;
            text-shadow:
                2px 2px 0 #000,
                -1px -1px 0 #000,
                0 -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000,
                0 0 20px var(--teal-bright);
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #control-panel {
            margin-top: 40px;
            background: var(--cyan-light);
            padding: 15px;
            border-radius: 10px;
            color: #333;
            font-size: 14px;
            border: 2px solid var(--orange);
            width: 450px;
        }

        .control-group {
            margin-bottom: 10px;
        }
        label { font-weight: bold; margin-right: 10px; }
        input, select { padding: 5px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box;}
        button { background: var(--orange); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;}
        button:hover { background: var(--teal-bright); }

        #connection-status {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }
        .connected { color: var(--teal-dark); }
        .disconnected { color: var(--red-accent); }

      .floating-clues-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 12px;
        pointer-events: none;
        z-index: 1;
      }

      .floating-clue {
        position: absolute;
        color: #000000 !important;
        font-size: 2.2rem;
        font-weight: 900;
        pointer-events: none;
        white-space: pre-wrap;
        max-width: 80%;
        text-align: center;
        opacity: 1;
        left: 50%;
        top: 50%;
        transform-origin: center center;
        /* No transition, we will animate with requestAnimationFrame */
      }
</style>
</head>
<body>

    <div class="clue-widget" id="clueWidget">
        <div class="sender-label">
            <img class="goose-avatar" id="gooseAvatarStylus" src="" alt="">
            <span id="stylusLabel"></span>
        </div>
        <div class="clue-title" id="clueTitle"></div>
          <div class="floating-clues-container" id="floatingCluesContainer"></div>
        <div class="clue-text" id="clueDisplay"></div>
    </div>

    <div id="control-panel">
        <div id="connection-status" class="disconnected">WS Disconnected</div>
        <div class="control-group">
            <label>Game State:</label>
            <select id="simState">
                <option value="inactive">Inactive</option>
                <option value="waiting">Waiting (Guest picked)</option>
                <option value="active">Active (Guessing phase)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Goose Name:</label>
            <input type="text" id="simGuest" placeholder="e.g. KarenChauDesigns123456789">
        </div>
        <button onclick="applySimulation()">Trigger Simulation</button>
    </div>

    <script>
        const WS_URL = 'ws://127.0.0.1:8080/';
        const POLL_INTERVAL_MS = 1500;
        const REQUEST_ID = 'goose_clue_overlay_poll';

        const VAR_STATE = 'guessing-game_state';
        const VAR_GUEST = 'guessing-game_currentGuest';
        const VAR_CLUE = 'guessing-game_gooseClue';
        const VAR_WINNER = 'guessing-game_winner';
        const VAR_ANSWER = 'guessing-game_winningWord';

        let ws;
        let pollInterval;
        let simulationMode = false;

        let currentGameState = 'inactive';
        let currentGameGuest = '';
        let currentGameClue = '';
        let currentWinner = '';
        let currentAnswer = '';

        // --- AUDIO LOGIC ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSuccess() {
            try {
                initAudio();
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';

                const now = audioCtx.currentTime;

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.setValueAtTime(0.3, now + 0.4);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.0);

                osc1.frequency.setValueAtTime(523.25, now);
                osc2.frequency.setValueAtTime(523.25, now);

                osc1.frequency.setValueAtTime(659.25, now + 0.15);
                osc2.frequency.setValueAtTime(659.25, now + 0.15);

                osc1.frequency.setValueAtTime(783.99, now + 0.3);
                osc2.frequency.setValueAtTime(783.99, now + 0.3);

                osc1.frequency.setValueAtTime(1046.50, now + 0.45);
                osc2.frequency.setValueAtTime(1046.50, now + 0.45);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 1.0);
                osc2.stop(now + 1.0);
            } catch(e) {
                console.warn("Audio play error", e);
            }
        }

        const clueWidget = document.getElementById('clueWidget');
        const clueTitle = document.getElementById('clueTitle');
        const stylusLabel = document.getElementById('stylusLabel');
        const gooseAvatarStylus = document.getElementById('gooseAvatarStylus');
        const clueDisplay = document.getElementById('clueDisplay');
        const connStatus = document.getElementById('connection-status');

        // Main function to update UI based on variables
        function updateUI(state, guest, clue, winner, answer) {
            clueTitle.className = 'clue-title';
            const safeState = state ? String(state).trim().toLowerCase() : 'inactive';
            const safeGuest = guest ? String(guest).trim() : '';

            if (safeState === 'inactive') {
                clueTitle.innerHTML = `Mods: Start game with <span style="color: var(--yellow);">!giveword @user</span>`;
                stylusLabel.innerHTML = ''; // Blank stylus text when inactive, but pencil remains docked
                gooseAvatarStylus.style.display = 'none';
                clueDisplay.innerHTML = ''; // Interior of iPad remains fully transparent

            } else if (safeState === 'waiting') {
                clueTitle.classList.add('waiting');
                clueTitle.innerHTML = `Waiting for ${safeGuest}<br>to lock in a secret word...`;
                stylusLabel.innerHTML = '';
                gooseAvatarStylus.style.display = 'none';
                clueDisplay.innerHTML = '';

            } else if (safeState === 'active') {
                clueTitle.classList.add('active');
                clueTitle.innerHTML = 'Guess ONE-WORD answers in chat!';
                stylusLabel.innerHTML = `Clues from ${safeGuest}`;
                clueDisplay.innerHTML = '';
            } else if (safeState === 'recap') {
                clueTitle.classList.add('waiting');
                const safeWinner = winner ? String(winner).trim() : '';
                const safeAnswer = answer ? String(answer).trim() : '';

                let titleHtml = '';
                if (safeWinner) {
                    if (safeWinner.toLowerCase().includes('forfeited')) {
                        titleHtml = safeWinner;
                    } else if (safeWinner.toLowerCase() === "time's up") {
                        titleHtml = "TIME'S UP! No one guessed it.";
                    } else {
                        titleHtml = `WINNER: ${safeWinner}`;
                    }
                } else {
                    titleHtml = 'Round Over!';
                }

                if (safeAnswer) {
                    if (titleHtml !== 'Round Over!') {
                        titleHtml += `<br>The secret word was ${safeAnswer}!`;
                    } else {
                        titleHtml = `The secret word was ${safeAnswer}!`;
                    }
                }

                clueTitle.innerHTML = titleHtml;
                stylusLabel.innerHTML = `Clues were from&nbsp;<span style="color: var(--orange);">${safeGuest}</span>`;
                clueDisplay.innerHTML = clue ? clue : '';
            }

            if ((safeState === "active" || safeState === "recap") && safeGuest) {
                fetch('https://decapi.me/twitch/avatar/' + safeGuest)
                    .then(r => r.text())
                    .then(url => {
                        if (url && url.startsWith('http')) {
                            gooseAvatarStylus.src = url;
                            gooseAvatarStylus.style.display = "inline-block";
                        }
                    })
                    .catch(err => console.error("Error fetching goose avatar", err));
            } else {
                gooseAvatarStylus.style.display = "none";
            }
        }

        function connect() {
            if (simulationMode) return;

            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    connStatus.textContent = 'Connected to Streamer.bot';
                    connStatus.className = 'connected';
                    requestGlobals();
                    pollInterval = setInterval(requestGlobals, POLL_INTERVAL_MS);
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.id === REQUEST_ID + '_persisted' && data.variables) {
                        parseVariables(data.variables);
                    }
                    if (data.event === "goose_clue_msg") {
                        createFloatingClue(data.message, data.color);
                    }
                };

                ws.onclose = () => {
                    connStatus.textContent = 'Disconnected';
                    connStatus.className = 'disconnected';
                    clearInterval(pollInterval);
                    if (!simulationMode) {
                        setTimeout(connect, 5000);
                    }
                };

                ws.onerror = () => {
                    ws.close();
                };
            } catch (error) {
                console.warn("WebSocket connection failed.");
            }
        }


      let activeClues = [];
      let animationFrameId = null;

      function animateClues() {
        const container = document.getElementById('floatingCluesContainer');
        if (!container) return;

        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;

        for (let idx = 0; idx < activeClues.length; idx++) {
          const clue = activeClues[idx];

          // Update position
          clue.x += clue.vx;
          clue.y += clue.vy;

          // Check boundaries and bounce
          // Calculate max offset from center based on container dims (roughly half width/height)
          const maxOffsetX = containerWidth / 2 - 50; // 50px buffer for clue width
          const maxOffsetY = containerHeight / 2 - 30; // 30px buffer for clue height

          if (clue.x > maxOffsetX) { clue.x = maxOffsetX; clue.vx *= -1; }
          else if (clue.x < -maxOffsetX) { clue.x = -maxOffsetX; clue.vx *= -1; }

          if (clue.y > maxOffsetY) { clue.y = maxOffsetY; clue.vy *= -1; }
          else if (clue.y < -maxOffsetY) { clue.y = -maxOffsetY; clue.vy *= -1; }

          // Apply scale based on index (newest is index 0 for math)
          const i = activeClues.length - 1 - idx;
          const scale = Math.max(0.3, 1 - (i * 0.15));

          clue.element.style.transform = `translate(calc(-50% + ${clue.x}px), calc(-50% + ${clue.y}px)) scale(${scale})`;
        }

        animationFrameId = requestAnimationFrame(animateClues);
      }

      function createFloatingClue(word, color, speed) {
        const container = document.getElementById('floatingCluesContainer');
        if (!container) return;

        const clueEl = document.createElement('div');
        clueEl.className = 'floating-clue';
        clueEl.textContent = word;

        container.appendChild(clueEl);

        const startAngle = Math.random() * Math.PI * 2;
        const speedMultiplier = (speed !== undefined) ? speed : 1.5;

        const clueObj = {
          element: clueEl,
          timestamp: Date.now(),
          x: 0,
          y: 0,
          vx: Math.cos(startAngle) * speedMultiplier,
          vy: Math.sin(startAngle) * speedMultiplier
        };
        activeClues.push(clueObj);

        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(animateClues);
        }

        const duration = 12000;

        setTimeout(() => {
          if (clueEl.parentNode) {
            clueEl.parentNode.removeChild(clueEl);
          }
          activeClues = activeClues.filter(c => c !== clueObj);
          if (activeClues.length === 0 && animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
        }, duration);
      }

      function requestGlobals() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ request: "GetGlobals", id: REQUEST_ID + '_persisted', persisted: true }));
            }
        }

        function parseVariables(varsObj) {
            if (varsObj[VAR_STATE]) currentGameState = varsObj[VAR_STATE].value;
            if (varsObj[VAR_GUEST]) currentGameGuest = varsObj[VAR_GUEST].value;
            if (varsObj[VAR_CLUE]) currentGameClue = varsObj[VAR_CLUE].value;

            let newWinner = currentWinner;
            if (varsObj[VAR_WINNER]) newWinner = varsObj[VAR_WINNER].value;
            if (varsObj[VAR_ANSWER]) currentAnswer = varsObj[VAR_ANSWER].value;

            if (newWinner !== currentWinner) {
                if (newWinner !== "" && newWinner.toLowerCase() !== "time's up" && !newWinner.toLowerCase().includes("forfeited")) {
                    playSuccess();
                }
                currentWinner = newWinner;
            }

            updateUI(currentGameState, currentGameGuest, currentGameClue, currentWinner, currentAnswer);
        }

        function applySimulation() {
            simulationMode = true;
            connStatus.textContent = 'Simulation Mode Active';
            connStatus.className = 'connected';
            if (ws) { ws.onclose = null; ws.close(); }
            clearInterval(pollInterval);

            const simState = document.getElementById('simState').value;
            const simGuest = document.getElementById('simGuest').value;

            let simClue = '';
            if (simState === 'active') {
                simClue = 'QUACK';
            }

            updateUI(simState, simGuest, simClue, '', '');
        }

        // Initialize state on load
        updateUI('inactive', '', '', '', '');

        // Start polling connection
        connect();
    </script>
</body>
</html>
