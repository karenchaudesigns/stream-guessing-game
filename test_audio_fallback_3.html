<!DOCTYPE html>
<html>
<body>
<script>
function playSound(soundName) {
    const audio = new Audio(`${soundName}.mp3`);
    audio.oncanplaythrough = () => {
        console.log("can play for", soundName);
        audio.play().catch(e => console.log("play error", e));
    };
    audio.onerror = () => {
        console.log("fallback for", soundName);
    };
}
playSound("missing");
</script>
</body>
</html>
