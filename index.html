<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guessing Game Overlay</title>
    <!-- We will inject CSS here later -->
    <style>
      /* --- GLOBAL --- */
      :root {
        /* Sunny Pond Palette */
        --cyan-light: #ecfeff;
        --cyan: #06b6d4;
        --teal-bright: #2dd4bf;
        --teal-dark: #115e59;
        --yellow: #facc15;
        --orange: #ea580c;
        --cyan-neon: #43d9f2;
        --red-accent: #f24343;

        /* Timer specific */
        --timer-teal-dark: #005f73;
        --timer-teal-light: #0a9396;
        --timer-red: #ae2012;
        --circle-size: 200px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: transparent;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        position: relative;
      }

      /* Layout */
      .layout-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
        pointer-events: none;
      }

      .left-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        pointer-events: auto;
        width: 350px;
      }

      .center-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        flex-grow: 1;
        padding-top: 50px;
        pointer-events: auto;
        position: relative; /* For announcement box absolute positioning */
      }

      .right-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-end;
        pointer-events: auto;
        width: 250px; /* enough space for timer */
      }

      /* --- LEADERBOARD --- */
      /* Leaderboard Widget Container */
      .leaderboard-widget {
        background: var(--teal-dark);
        border: 4px solid var(--cyan);
        border-radius: 16px;
        min-width: 350px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Header */
      .header {
        background: rgba(0, 0, 0, 0.3);
        padding: 15px 20px;
        border-bottom: 2px solid var(--cyan);
        text-align: center;
      }

      .header h2 {
        color: var(--yellow);
        font-size: 1.5rem;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: 2px;
        text-shadow: 2px 2px 4px var(--orange);
      }

      /* Leaderboard List */
      .list-container {
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 100px;
      }

      /* Individual Rows */
      .score-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(236, 254, 255, 0.05); /* cyan-light with opacity */
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 1.2rem;
        font-weight: 700;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        transition: transform 0.2s ease;
      }

      .username {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--cyan-light);
      }

      .score-value {
        color: var(--cyan-neon);
        font-weight: 900;
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); /* cyan with opacity */
      }

      /* Special styling for top 3 using Sunny Pond colors */
      .score-row.rank-1 {
        background: linear-gradient(
          90deg,
          rgba(250, 204, 21, 0.2),
          transparent
        ); /* yellow */
        border-left: 5px solid var(--yellow);
      }
      .score-row.rank-1 .username {
        color: var(--yellow);
      }

      .score-row.rank-2 {
        background: linear-gradient(
          90deg,
          rgba(236, 254, 255, 0.2),
          transparent
        ); /* cyan-light */
        border-left: 5px solid var(--cyan-light);
      }
      .score-row.rank-2 .username {
        color: var(--cyan-light);
      }

      .score-row.rank-3 {
        background: linear-gradient(
          90deg,
          rgba(234, 88, 12, 0.2),
          transparent
        ); /* orange */
        border-left: 5px solid var(--orange);
      }
      .score-row.rank-3 .username {
        color: var(--orange);
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        color: var(--cyan-light);
        opacity: 0.7;
        font-style: italic;
        padding: 20px 0;
        font-size: 1rem;
      }

      /* Hidden Simulation Panel - Hide in OBS with CSS */

      button {
        background: var(--orange);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }

      button:hover {
        background: var(--teal-bright);
        color: var(--teal-dark);
      }

      /* Connection indicator */
      #connection-status {
        font-size: 0.8rem;
        text-align: center;
        font-weight: bold;
      }
      .connected {
        color: var(--teal-dark);
      }
      .disconnected {
        color: var(--red-accent);
      }

      /* --- CLUE WIDGET --- */
      .clue-widget {
        position: relative;
        background: transparent; /* Inside is fully transparent */
        border: 12px solid #1a1a1a; /* iPad Bezel */
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 600px;
        min-height: 350px;
        display: flex;
        flex-direction: column;

        /* Entrance Animation */
        animation: bounceIn 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      }

      @keyframes bounceIn {
        0% {
          opacity: 0;
          transform: translateY(50px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .sender-label {
        position: absolute;
        top: -30px; /* Docked right above the top bezel without overlapping */
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #e0e0e0 40%,
          #ffffff 100%
        );
        color: var(--teal-dark);
        padding: 5px 25px 5px 15px;
        border-radius: 4px 60px 60px 4px; /* Flat back left, sharp tapered nib right */
        font-weight: 900;
        font-size: 1.1rem;
        box-shadow:
          inset 0 -2px 5px rgba(0, 0, 0, 0.2),
          inset 0 2px 5px rgba(255, 255, 255, 0.8),
          0 5px 10px rgba(0, 0, 0, 0.3);
        border-left: 8px solid #ccc; /* Silver band detail */
        border-right: 2px solid #ddd; /* Nib detail */
        white-space: nowrap;
        width: 450px; /* Long enough to fit max length Twitch usernames */
        text-align: center;
        letter-spacing: 1px;
        text-transform: uppercase;
        z-index: 10;
      }

      .clue-title {
        background: rgba(17, 94, 89, 0.95); /* Deep Teal for Inactive */
        color: #ffffff; /* White text for Inactive */
        font-size: 1.2rem;
        font-weight: 800;
        text-align: center;
        padding: 12px;
        border-bottom: 2px solid var(--teal-dark);
        border-radius: 12px 12px 0 0;
        letter-spacing: 1px;
        text-shadow: none;
        transition: all 0.3s ease;
      }

      .clue-title.waiting {
        background: var(--yellow);
        color: var(--teal-dark);
        text-shadow: none;
      }

      .clue-title.active {
        background: var(--orange);
        color: var(--cyan-light);
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
      }

      .clue-text {
        color: #ffffff;
        font-size: 3rem;
        font-weight: 900;
        line-height: 1.2;
        text-shadow:
          2px 2px 0 #000,
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000,
          0 0 20px var(--teal-bright);
        text-align: center;
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .control-group {
        margin-bottom: 10px;
      }
      label {
        font-weight: bold;
        margin-right: 10px;
      }
      input,
      select {
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        background: var(--orange);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      button:hover {
        background: var(--teal-bright);
      }

      #connection-status {
        font-size: 0.8rem;
        font-weight: bold;
        margin-bottom: 8px;
        text-align: center;
      }
      .connected {
        color: var(--teal-dark);
      }
      .disconnected {
        color: var(--red-accent);
      }

      /* --- ANNOUNCEMENT --- */
      /* Announcement Container */
      #announcement-box {
        background: var(--teal-dark);
        border: 4px solid var(--cyan);
        border-radius: 16px;
        padding: 40px 60px;
        text-align: center;
        box-shadow:
          0 0 40px rgba(6, 182, 212, 0.5),
          inset 0 0 20px rgba(0, 0, 0, 0.8);

        /* Flexible width and text wrapping to prevent overflow */
        width: 80vw;
        max-width: 800px;
        word-wrap: break-word;
        overflow-wrap: break-word;

        /* Position perfectly in the center */
        position: absolute;
        top: 50%;
        left: 50%;

        /* Hidden state by default - incorporate -50% translation for centering */
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.8);
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none;
      }

      /* Visible state triggered by JavaScript */
      #announcement-box.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      /* Typography */
      #winner-text {
        /* Responsive font size so it shrinks before breaking */
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 4px;
        color: var(--yellow);
        text-shadow:
          3px 3px 0 #000,
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000,
          0 0 20px var(--orange);
        line-height: 1.2;
      }

      #answer-text {
        /* Responsive font size */
        font-size: clamp(1.2rem, 3.5vw, 2rem);
        font-weight: 700;
        margin-top: 15px;
        color: var(--cyan-light);
        text-shadow:
          2px 2px 0 #000,
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000,
          0 0 15px var(--cyan-neon);
      }

      /* Hidden Simulation Panel - Hide in OBS with CSS */

      button {
        background: var(--orange);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        font-size: 1.1rem;
      }

      button:hover {
        background: var(--teal-bright);
        color: var(--teal-dark);
      }

      /* Connection indicator */
      #connection-status {
        font-size: 0.8rem;
        text-align: center;
        font-weight: bold;
      }
      .connected {
        color: var(--teal-dark);
      }
      .disconnected {
        color: var(--red-accent);
      }

      /* Override Announcement Positioning for integrated layout */
      #announcement-box {
        /* Position relative to center-panel instead of screen */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -30%) scale(0.8);
        z-index: 50; /* Ensure it's above clue */
      }

      /* --- TIMER --- */
      /* Sunny Pond Color Palette */

      /* Timer Container */
      .timer-widget {
        position: relative;
        width: var(--circle-size);
        height: var(--circle-size);
        background: linear-gradient(
          135deg,
          var(--teal-dark),
          var(--teal-light)
        );
        border-radius: 50%;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 4px solid var(--teal-dark);
        transition: all 0.3s ease;
      }

      /* SVG Progress Ring (Hidden by default until <= 60s) */
      .progress-ring {
        position: absolute;
        top: -4px;
        left: -4px;
        width: calc(100% + 8px);
        height: calc(100% + 8px);
        transform: rotate(-90deg);
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }

      .progress-ring.visible {
        opacity: 1;
      }

      .progress-ring__circle {
        fill: transparent;
        stroke: var(--orange);
        stroke-width: 8;
        stroke-linecap: round;
        transition:
          stroke-dashoffset 1s linear,
          stroke 0.3s ease;
      }

      /* Time Display Text */
      .time-display {
        font-weight: 800;
        text-align: center;
        line-height: 1;
        z-index: 10;
        transition: color 0.3s ease;
      }

      /* State: Standard ( > 60 seconds) */
      .state-standard .time-display {
        font-size: 3rem; /* text-4xl equivalent to fit MM:SS */
        letter-spacing: 2px;
      }

      /* State: Stopwatch ( <= 60 seconds) */
      .state-stopwatch .time-display {
        font-size: 5rem; /* Massive text for seconds only */
      }

      .secs-label {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0;
        margin-top: -5px;
        font-weight: bold;
        z-index: 10;
      }

      .state-stopwatch .secs-label {
        opacity: 0.8;
      }

      /* State: Danger ( <= 10 seconds) */
      .state-danger .progress-ring__circle {
        stroke: var(--red);
      }

      .state-danger .time-display,
      .state-danger .secs-label {
        color: var(--red);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      .state-danger {
        animation: pulse 1s infinite;
      }

      /* Simulation Control Panel (Hidden in standard OBS dimensions) */

      #control-panel button {
        background: var(--orange);
        color: var(--teal-dark);
        font-weight: bold;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        margin: 5px;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }
      #control-panel button:hover {
        background: var(--yellow);
        transform: scale(1.05);
      }
      #control-panel input {
        padding: 5px;
        width: 60px;
        text-align: center;
        background: var(--teal-light);
        border: 1px solid var(--yellow);
        color: white;
        border-radius: 4px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="layout-container">
      <!-- Left Panel: Leaderboard -->
      <div class="left-panel">
        <div class="leaderboard-widget">
          <div class="header">
            <h2>🦆 LEADERBOARD</h2>
          </div>
          <div class="list-container" id="leaderboard-list">
            <div class="empty-state">Waiting for scores...</div>
          </div>
        </div>
      </div>

      <!-- Center Panel: Goose Clue Overlay & Announcement -->
      <div class="center-panel">
        <div class="clue-widget" id="clueWidget">
          <div class="sender-label" id="stylusLabel"></div>
          <div class="clue-title" id="clueTitle"></div>
          <div class="clue-text" id="clueDisplay"></div>
        </div>

        <div id="announcement-box">
          <div id="winner-text"></div>
          <div id="answer-text"></div>
        </div>
      </div>

      <!-- Right Panel: Timer -->
      <div class="right-panel">
        <div class="timer-widget state-standard" id="timerWidget">
          <svg class="progress-ring" id="progressRing">
            <circle
              class="progress-ring__circle"
              id="ringCircle"
              cx="104"
              cy="104"
              r="96"
            ></circle>
          </svg>
          <div class="time-display" id="timeDisplay">00:00</div>
          <div class="secs-label" id="secsLabel">SECS</div>
        </div>
      </div>
    </div>

    <!-- We will inject JS here later -->
    <script>
      // --- CONFIGURATION ---
      const WS_URL = "ws://127.0.0.1:8080/";
      const POLL_INTERVAL_MS = 1500;
      const REQUEST_ID = "guessing_game_integrated_poll";

      // Variable Names
      const VAR_SCORES = "guessing-game_leaderboard";
      const VAR_STATE = "guessing-game_state";
      const VAR_GUEST = "guessing-game_currentGuest";
      const VAR_CLUE = "guessing-game_gooseClue";
      const VAR_WINNER = "guessing-game_winner";
      const VAR_ANSWER = "guessing-game_winningWord";

      const MAX_PLAYERS_TO_SHOW = 5;

      // State Tracking
      let currentScoresString = "";
      let currentWinner = "";
      let currentGameState = "inactive";
      let currentGameGuest = "";
      let currentGameClue = "";
      let currentAnswer = "";
      let ws;
      let pollInterval;

      // Timer Variables
      let timerInterval;
      let timeRemaining = 0;
      let totalSeconds = 0;

      // --- DOM Elements ---
      // Leaderboard
      const lbListContainer = document.getElementById("leaderboard-list");

      // Clue Widget
      const clueTitle = document.getElementById("clueTitle");
      const stylusLabel = document.getElementById("stylusLabel");
      const clueDisplay = document.getElementById("clueDisplay");

      // Announcement
      const announceBox = document.getElementById("announcement-box");
      const winnerText = document.getElementById("winner-text");
      const answerText = document.getElementById("answer-text");

      // Timer
      const timerWidget = document.getElementById("timerWidget");
      const timeDisplay = document.getElementById("timeDisplay");
      const progressRing = document.getElementById("progressRing");
      const ringCircle = document.getElementById("ringCircle");

      // --- INIT TIMER SVG ---
      const radius = ringCircle.r.baseVal.value;
      const circumference = radius * 2 * Math.PI;
      ringCircle.style.strokeDasharray = `${circumference} ${circumference}`;
      ringCircle.style.strokeDashoffset = circumference;

      // --- TIMER LOGIC ---
      function setTimerProgress(percent) {
        const offset = circumference - (percent / 100) * circumference;
        ringCircle.style.strokeDashoffset = offset;
      }

      function updateTimerDisplay() {
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timeDisplay.innerText = "00";
          setTimerProgress(0);
          sendToStreamerBot("timedout");
          return;
        }

        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;

        if (timeRemaining > 60) {
          timerWidget.className = "timer-widget state-standard";
          progressRing.classList.remove("visible");
          timeDisplay.innerText = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        } else {
          progressRing.classList.add("visible");
          timeDisplay.innerText = seconds.toString().padStart(2, "0");

          const percent = (timeRemaining / 60) * 100;
          setTimerProgress(percent);

          if (timeRemaining <= 10) {
            timerWidget.className = "timer-widget state-stopwatch state-danger";
          } else {
            timerWidget.className = "timer-widget state-stopwatch";
          }
        }
      }

      function startTimer(durationMinutes) {
        clearInterval(timerInterval);
        totalSeconds = durationMinutes * 60;
        timeRemaining = totalSeconds;

        updateTimerDisplay();

        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();
        }, 1000);
      }

      function stopTimer() {
        clearInterval(timerInterval);
        timeRemaining = 0;
        timerWidget.className = "timer-widget state-standard";
        progressRing.classList.remove("visible");
        timeDisplay.innerText = "00:00";
      }

      function sendToStreamerBot(status) {
        try {
          const tempWs = new WebSocket(WS_URL);
          tempWs.onopen = () => {
            tempWs.send(
              JSON.stringify({
                request: "DoAction",
                action: { name: "Timer Finished" },
                id: "timer-finished-trigger",
              }),
            );
            tempWs.close();
          };
        } catch (e) {
          console.log(`Action triggered: Timer Finished.`);
        }
      }

      // --- LEADERBOARD LOGIC ---
      function renderLeaderboard(scoresArray) {
        lbListContainer.innerHTML = "";

        if (scoresArray.length === 0) {
          lbListContainer.innerHTML =
            '<div class="empty-state">No scores yet!</div>';
          return;
        }

        const topPlayers = scoresArray.slice(0, MAX_PLAYERS_TO_SHOW);

        topPlayers.forEach((player, index) => {
          const rank = index + 1;
          const row = document.createElement("div");
          row.className = `score-row rank-${rank}`;

          let medal = "";
          if (rank === 1) medal = "🥇";
          if (rank === 2) medal = "🥈";
          if (rank === 3) medal = "🥉";

          row.innerHTML = `
                    <div class="username">
                        <span>${medal}</span>
                        <span>${player.user}</span>
                    </div>
                    <div class="score-value">${player.score} pt</div>
                `;

          lbListContainer.appendChild(row);
        });
      }

      // --- CLUE LOGIC ---
      function updateClueUI(state, guest, clue) {
        clueTitle.className = "clue-title";
        const safeState = state
          ? String(state).trim().toLowerCase()
          : "inactive";
        const safeGuest = guest ? String(guest).trim() : "";

        if (safeState === "inactive") {
          clueTitle.innerHTML = `Mods: Start game with <span style="color: var(--yellow);">!giveword @user</span>`;
          stylusLabel.innerHTML = "";
          clueDisplay.innerHTML = "";
        } else if (safeState === "waiting") {
          clueTitle.classList.add("waiting");
          clueTitle.innerHTML = "Waiting for word...";
          stylusLabel.innerHTML = `CLUES FROM <span style="color: var(--orange);">${safeGuest}</span>`;
          clueDisplay.innerHTML = "";
        } else if (safeState === "active") {
          clueTitle.classList.add("active");
          clueTitle.innerHTML = "Guess ONE-WORD answers in chat!";
          stylusLabel.innerHTML = `CLUES FROM ${safeGuest}`;
          clueDisplay.innerHTML = clue ? clue : "";
        } else if (safeState === "recap") {
          clueTitle.classList.add("waiting");
          clueTitle.innerHTML = "Round Over!";
          stylusLabel.innerHTML = `CLUES WERE FROM <span style="color: var(--orange);">${safeGuest}</span>`;
          clueDisplay.innerHTML = clue ? clue : "";
        }
      }

      // --- ANNOUNCEMENT LOGIC ---
      function showAnnouncement() {
        announceBox.classList.add("show");
      }

      function hideAnnouncement() {
        announceBox.classList.remove("show");
      }

      // --- WEBSOCKET HANDLERS ---
      function requestGlobals() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              request: "GetGlobals",
              id: REQUEST_ID + "_persisted",
              persisted: true,
            }),
          );
          ws.send(
            JSON.stringify({
              request: "GetGlobals",
              id: REQUEST_ID + "_nonpersisted",
              persisted: false,
            }),
          );
        }
      }

      function processVariables(variablesObj) {
        // 1. Process Leaderboard
        if (
          variablesObj[VAR_SCORES] &&
          variablesObj[VAR_SCORES].value != null
        ) {
          const rawValue = variablesObj[VAR_SCORES].value;
          const stringifiedValue =
            typeof rawValue === "object"
              ? JSON.stringify(rawValue)
              : String(rawValue);

          if (stringifiedValue !== currentScoresString) {
            currentScoresString = stringifiedValue;
            try {
              let parsedData =
                typeof rawValue === "object" ? rawValue : JSON.parse(rawValue);
              if (typeof parsedData === "string")
                parsedData = JSON.parse(parsedData);

              let scoresArray = [];
              if (Array.isArray(parsedData)) {
                scoresArray = parsedData.map((item) => ({
                  user: item.username,
                  score: parseInt(item.score) || 0,
                }));
              } else {
                for (const [user, score] of Object.entries(parsedData)) {
                  scoresArray.push({ user: user, score: parseInt(score) || 0 });
                }
              }

              scoresArray.sort((a, b) => b.score - a.score);
              renderLeaderboard(scoresArray);
            } catch (e) {
              console.error("Failed to parse scores JSON:", e);
            }
          }
        }

        // 2. Process Clue & State
        if (variablesObj[VAR_STATE]) currentGameState = variablesObj[VAR_STATE].value;
        if (variablesObj[VAR_GUEST]) currentGameGuest = variablesObj[VAR_GUEST].value;
        if (variablesObj[VAR_CLUE]) currentGameClue = variablesObj[VAR_CLUE].value;

        updateClueUI(currentGameState, currentGameGuest, currentGameClue);

        // 3. Process Announcement
        let currentState = String(currentGameState).trim().toLowerCase();

        // Preserve current values unless provided in this payload
        let newWinner = currentWinner;
        let newAnswer = currentAnswer;

        if (variablesObj[VAR_WINNER] && variablesObj[VAR_WINNER].value != null) {
          newWinner = String(variablesObj[VAR_WINNER].value).trim();
        }
        if (variablesObj[VAR_ANSWER] && variablesObj[VAR_ANSWER].value != null) {
          newAnswer = String(variablesObj[VAR_ANSWER].value).trim();
        }

        if (currentState !== "recap") {
          currentWinner = "";
          currentAnswer = "";
          hideAnnouncement();
        } else if (newWinner !== currentWinner || newAnswer !== currentAnswer) {
          currentWinner = newWinner;
          currentAnswer = newAnswer;

          if (currentWinner === "") {
            hideAnnouncement();
          } else {
            if (currentWinner.toLowerCase().includes("forfeited")) {
                winnerText.textContent = currentWinner.toUpperCase();
            } else {
                winnerText.textContent = `WINNER: ${currentWinner}`;
            }

            if (currentAnswer !== "") {
              answerText.textContent = `ANSWER: ${currentAnswer}`;
              answerText.style.display = "block";
            } else {
              answerText.style.display = "none";
            }

            showAnnouncement();
          }
        }
      }

      function connect() {
        try {
          ws = new WebSocket(WS_URL);

          ws.onopen = () => {
            console.log("Connected to Streamer.bot");

            // Subscribe to global variable changes for timer events
            ws.send(
              JSON.stringify({
                request: "Subscribe",
                events: { general: ["Custom"] },
                id: "integrated-listener",
              }),
            );

            requestGlobals();
            pollInterval = setInterval(requestGlobals, POLL_INTERVAL_MS);
          };

          ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            // Handle variable polling
            if (
              (msg.id === REQUEST_ID + "_persisted" ||
                msg.id === REQUEST_ID + "_nonpersisted") &&
              msg.variables
            ) {
              processVariables(msg.variables);
            }

            // Handle custom events (Timer)
            if (
              msg.event?.source === "General" &&
              msg.event?.type === "Custom"
            ) {
              if (msg.data?.name === "GameStart") {
                const duration =
                  msg.data.arguments["guessing-game_timerDuration"] || 2;
                const secretWord =
                  msg.data.arguments["guessing-game_secretWord"];

                if (secretWord && secretWord.trim() !== "") {
                  startTimer(parseInt(duration));
                }
              } else if (msg.data?.name === "GameStop") {
                stopTimer();
              }
            }
          };

          ws.onclose = () => {
            console.log("Disconnected from Streamer.bot. Reconnecting...");
            clearInterval(pollInterval);
            setTimeout(connect, 5000);
          };

          ws.onerror = (error) => {
            ws.close();
          };
        } catch (error) {
          console.warn("WebSocket creation failed.", error);
        }
      }

      // Initialize
      updateClueUI("inactive", "", "");
      connect();
    </script>
  </body>
</html>
