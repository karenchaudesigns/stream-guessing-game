<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guessing Game Overlay</title>
    <!-- We will inject CSS here later -->
    <style>
      /* --- GLOBAL --- */
      :root {
        /* Sunny Pond Palette */
        --cyan-light: #ecfeff;
        --cyan: #06b6d4;
        --teal-bright: #2dd4bf;
        --teal-dark: #115e59;
        --yellow: #facc15;
        --orange: #ea580c;
        --cyan-neon: #43d9f2;
        --red-accent: #f24343;

        /* Timer specific */
        --timer-teal-dark: #2e7d32;
        --timer-teal-light: #81c784;
        --timer-yellow: #fbc02d;
        --timer-orange: #ee9b00;
        --timer-red: #ae2012;
        --circle-size: 200px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: transparent;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        position: relative;
      }

      /* Layout */
      .layout-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
        pointer-events: none;
      }

      .left-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        pointer-events: auto;
        width: 350px;
      }

      .center-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        flex-grow: 1;
        padding-top: 50px;
        pointer-events: auto;
        position: relative; /* For announcement box absolute positioning */
      }

      .right-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-end;
        pointer-events: auto;
        width: 250px; /* enough space for timer */
      }

      /* --- LEADERBOARD --- */
      /* Leaderboard Widget Container */
      .leaderboard-widget {
        background: rgba(24, 24, 27, 0.9); /* Same background color as Twitch dark mode */
        border: 4px solid var(--cyan);
        border-radius: 16px;
        min-width: 300px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Header */
      .header {
        background: transparent;
        padding: 10px 15px 5px 15px;
        text-align: center;
      }

      .header h2 {
        color: var(--cyan-light);
        font-size: 1.2rem;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }

      /* Leaderboard List */
      .list-container {
        padding: 5px 15px 15px 15px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 80px;
      }

      /* Individual Rows */
      .score-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: transparent;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 700;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        transition: transform 0.2s ease;
      }

      .username {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--cyan-light);
      }

      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--cyan);
        background-color: rgba(0, 0, 0, 0.3);
      }

      .score-value {
        color: var(--cyan-light);
        font-weight: 800;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        color: var(--cyan-light);
        opacity: 0.7;
        font-style: italic;
        padding: 20px 0;
        font-size: 1rem;
      }

      /* Hidden Simulation Panel - Hide in OBS with CSS */

      button {
        background: var(--orange);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }

      button:hover {
        background: var(--teal-bright);
        color: var(--teal-dark);
      }

      /* Connection indicator */
      #connection-status {
        font-size: 0.8rem;
        text-align: center;
        font-weight: bold;
      }
      .connected {
        color: var(--teal-dark);
      }
      .disconnected {
        color: var(--red-accent);
      }

      /* --- CLUE WIDGET --- */
      .clue-widget {
        position: relative;
        background: transparent; /* Inside is fully transparent */
        border: 12px solid #1a1a1a; /* iPad Bezel */
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 600px;
        min-height: 350px;
        display: flex;
        flex-direction: column;

        /* Entrance Animation */
        animation: bounceIn 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      }

      @keyframes bounceIn {
        0% {
          opacity: 0;
          transform: translateY(50px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .sender-label {
        position: absolute;
        top: -45px; /* Docked right above the top bezel without overlapping */
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #e0e0e0 40%,
          #ffffff 100%
        );
        color: var(--teal-dark);
        padding: 5px 25px 5px 15px;
        border-radius: 4px 50px 50px 4px / 4px 50% 50% 4px; /* Flatter back left, sharp tapered nib right */
        font-weight: 900;
        font-size: 1.1rem;
        box-shadow:
          inset 0 -2px 5px rgba(0, 0, 0, 0.2),
          inset 0 2px 5px rgba(255, 255, 255, 0.8),
          0 5px 10px rgba(0, 0, 0, 0.3);
        border-left: 8px solid #ccc; /* Silver band detail */
        white-space: nowrap;
        width: 450px; /* Long enough to fit max length Twitch usernames */
        height: 35px; /* Fixed height so shape doesn't change when empty */
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        letter-spacing: 1px;
        z-index: 10;
      }

      .clue-title {
        background: rgba(17, 94, 89, 0.95); /* Deep Teal for Inactive */
        color: #ffffff; /* White text for Inactive */
        font-size: 1.2rem;
        font-weight: 800;
        text-align: center;
        padding: 12px;
        border-bottom: 2px solid var(--teal-dark);
        border-radius: 12px 12px 0 0;
        letter-spacing: 1px;
        text-shadow: none;
        transition: all 0.3s ease;
      }

      .clue-title.waiting {
        background: var(--yellow);
        color: var(--teal-dark);
        text-shadow: none;
      }

      .clue-title.active {
        background: var(--orange);
        color: var(--cyan-light);
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
      }

      .clue-text {
        color: #ffffff;
        font-size: 3rem;
        font-weight: 900;
        line-height: 1.2;
        text-shadow:
          2px 2px 0 #000,
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000,
          0 0 20px var(--teal-bright);
        text-align: center;
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .control-group {
        margin-bottom: 10px;
      }
      label {
        font-weight: bold;
        margin-right: 10px;
      }
      input,
      select {
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        background: var(--orange);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      button:hover {
        background: var(--teal-bright);
      }

      #connection-status {
        font-size: 0.8rem;
        font-weight: bold;
        margin-bottom: 8px;
        text-align: center;
      }
      .connected {
        color: var(--teal-dark);
      }
      .disconnected {
        color: var(--red-accent);
      }

      /* Hidden Simulation Panel - Hide in OBS with CSS */

      button {
        background: var(--orange);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        font-size: 1.1rem;
      }

      button:hover {
        background: var(--teal-bright);
        color: var(--teal-dark);
      }

      /* Connection indicator */
      #connection-status {
        font-size: 0.8rem;
        text-align: center;
        font-weight: bold;
      }
      .connected {
        color: var(--teal-dark);
      }
      .disconnected {
        color: var(--red-accent);
      }

      /* --- TIMER --- */
      /* Sunny Pond Color Palette */

      /* Timer Container */
      .timer-widget {
        position: relative;
        width: var(--circle-size);
        height: var(--circle-size);
        background: linear-gradient(
          135deg,
          var(--timer-teal-dark),
          var(--timer-teal-light)
        );
        border-radius: 50%;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 8px solid #5d4037;
        color: var(--timer-yellow);
        transition: all 0.3s ease;
      }

      /* Stopwatch Button Pseudo-element */
      .timer-widget.state-stopwatch::before {
        content: "";
        position: absolute;
        top: -24px;
        left: 50%;
        transform: translateX(-50%);
        width: 24px;
        height: 16px;
        background: #9e9e9e;
        border: 4px solid #424242;
        border-radius: 4px 4px 0 0;
        z-index: 5;
      }

      /* SVG Progress Ring (Hidden by default until <= 60s) */
      .progress-ring {
        position: absolute;
        top: -8px; /* Offset adjusted for the thicker border */
        left: -8px;
        width: calc(100% + 16px);
        height: calc(100% + 16px);
        transform: rotate(-90deg);
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }

      .progress-ring.visible {
        opacity: 1;
      }

      .progress-ring__track {
        fill: transparent;
        stroke: rgba(0, 0, 0, 0.2);
        stroke-width: 8;
      }

      .progress-ring__circle {
        fill: transparent;
        stroke: var(--timer-orange);
        stroke-width: 8;
        stroke-linecap: round;
        transition:
          stroke-dashoffset 1s linear,
          stroke 0.3s ease;
      }

      /* Time Display Text */
      .time-display {
        font-weight: 800;
        text-align: center;
        line-height: 1;
        z-index: 10;
        transition: color 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      }

      /* State: Standard ( > 60 seconds) */
      .state-standard .time-display {
        font-size: 3rem; /* text-4xl equivalent to fit MM:SS */
        letter-spacing: 2px;
      }

      /* State: Stopwatch ( <= 60 seconds) */
      .state-stopwatch .time-display {
        font-size: 5rem; /* Massive text for seconds only */
      }

      .secs-label {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0;
        margin-top: -5px;
        font-weight: bold;
        z-index: 10;
      }

      .state-stopwatch .secs-label {
        opacity: 0.8;
      }

      /* State: Danger ( <= 10 seconds) */
      .state-danger .progress-ring__circle {
        stroke: var(--timer-red);
      }

      .state-danger .time-display,
      .state-danger .secs-label {
        color: var(--timer-red);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      .state-danger {
        animation: pulse 1s infinite;
      }

      /* Simulation Control Panel (Hidden in standard OBS dimensions) */

      #control-panel button {
        background: var(--orange);
        color: var(--teal-dark);
        font-weight: bold;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        margin: 5px;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }
      #control-panel button:hover {
        background: var(--yellow);
        transform: scale(1.05);
      }
      #control-panel input {
        padding: 5px;
        width: 60px;
        text-align: center;
        background: var(--teal-light);
        border: 1px solid var(--yellow);
        color: white;
        border-radius: 4px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="layout-container">
      <!-- Left Panel: Leaderboard -->
      <div class="left-panel">
        <div class="leaderboard-widget">
          <div class="header">
            <h2>LEADERBOARD</h2>
          </div>
          <div class="list-container" id="leaderboard-list">
            <div class="empty-state">Waiting for scores...</div>
          </div>
        </div>
      </div>

      <!-- Center Panel: Goose Clue Overlay -->
      <div class="center-panel">
        <div class="clue-widget" id="clueWidget">
          <div class="sender-label" id="stylusLabel"></div>
          <div class="clue-title" id="clueTitle"></div>
          <div class="clue-text" id="clueDisplay"></div>
        </div>
      </div>

      <!-- Right Panel: Timer -->
      <div class="right-panel">
        <div class="timer-widget state-standard" id="timerWidget">
          <svg class="progress-ring" id="progressRing">
            <circle class="progress-ring__track" cx="104" cy="104" r="96"></circle>
            <circle
              class="progress-ring__circle"
              id="ringCircle"
              cx="104"
              cy="104"
              r="96"
            ></circle>
          </svg>
          <div class="time-display" id="timeDisplay">00:00</div>
          <div class="secs-label" id="secsLabel">SECS</div>
        </div>
      </div>
    </div>

    <!-- We will inject JS here later -->
    <script>
      // --- CONFIGURATION ---
      const WS_URL = "ws://127.0.0.1:8080/";
      const POLL_INTERVAL_MS = 1500;
      const REQUEST_ID = "guessing_game_integrated_poll";

      // Variable Names
      const VAR_SCORES = "guessing-game_leaderboard";
      const VAR_STATE = "guessing-game_state";
      const VAR_GUEST = "guessing-game_currentGuest";
      const VAR_CLUE = "guessing-game_gooseClue";
      const VAR_WINNER = "guessing-game_winner";
      const VAR_ANSWER = "guessing-game_winningWord";
      const VAR_TIMER_STATUS = "guessing-game_timerStatus";
      const VAR_TIMER_DURATION = "guessing-game_timerDuration";

      const MAX_PLAYERS_TO_SHOW = 5;

      // State Tracking
      let currentScoresString = "";
      let currentWinner = "";
      let currentGameState = "inactive";
      let currentGameGuest = "";
      let currentGameClue = "";
      let currentAnswer = "";
      let currentTimerStatus = "stopped";
      let currentTimerDuration = 2;
      let currentTimerAvatarWinner = "";
      let ws;
      let pollInterval;

      // Timer Variables
      let timerInterval;
      let timeRemaining = 0;
      let totalSeconds = 0;

      // --- AUDIO LOGIC ---
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSuccess() {
        try {
          initAudio();
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          osc1.type = 'sine';
          osc2.type = 'triangle';

          const now = audioCtx.currentTime;

          osc1.connect(gainNode);
          osc2.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
          gainNode.gain.setValueAtTime(0.3, now + 0.4);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.0);

          osc1.frequency.setValueAtTime(523.25, now);
          osc2.frequency.setValueAtTime(523.25, now);

          osc1.frequency.setValueAtTime(659.25, now + 0.15);
          osc2.frequency.setValueAtTime(659.25, now + 0.15);

          osc1.frequency.setValueAtTime(783.99, now + 0.3);
          osc2.frequency.setValueAtTime(783.99, now + 0.3);

          osc1.frequency.setValueAtTime(1046.50, now + 0.45);
          osc2.frequency.setValueAtTime(1046.50, now + 0.45);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 1.0);
          osc2.stop(now + 1.0);
        } catch(e) {
          console.warn("Audio play error", e);
        }
      }

      function playTimeout() {
        try {
          initAudio();
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          osc.type = 'sawtooth';

          const now = audioCtx.currentTime;

          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.0);

          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 1.0);

          osc.start(now);
          osc.stop(now + 1.0);
        } catch(e) {
          console.warn("Audio play error", e);
        }
      }

      // --- DOM Elements ---
      // Leaderboard
      const lbListContainer = document.getElementById("leaderboard-list");

      // Clue Widget
      const clueTitle = document.getElementById("clueTitle");
      const stylusLabel = document.getElementById("stylusLabel");
      const clueDisplay = document.getElementById("clueDisplay");

      // Timer
      const timerWidget = document.getElementById("timerWidget");
      const timeDisplay = document.getElementById("timeDisplay");
      const progressRing = document.getElementById("progressRing");
      const ringCircle = document.getElementById("ringCircle");

      // --- INIT TIMER SVG ---
      const radius = ringCircle.r.baseVal.value;
      const circumference = radius * 2 * Math.PI;
      ringCircle.style.strokeDasharray = `${circumference} ${circumference}`;
      ringCircle.style.strokeDashoffset = circumference;

      // --- TIMER LOGIC ---
      function updateTimerAvatar(state, winner) {
        const safeState = state ? String(state).trim().toLowerCase() : "inactive";
        const safeWinner = winner ? String(winner).trim() : "";

        if (safeState === "recap" && safeWinner && safeWinner.toLowerCase() !== "time's up" && !safeWinner.toLowerCase().includes("forfeited")) {
          if (currentTimerAvatarWinner !== safeWinner) {
            currentTimerAvatarWinner = safeWinner;
            fetch(`https://decapi.me/twitch/avatar/${safeWinner}`)
              .then((res) => res.text())
              .then((url) => {
                if (url && url.startsWith("http")) {
                  timerWidget.style.background = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${url}')`;
                  timerWidget.style.backgroundSize = "cover";
                  timerWidget.style.backgroundPosition = "center";
                }
              })
              .catch((err) => console.error("Error fetching avatar for timer:", err));
          }
        } else {
          if (currentTimerAvatarWinner !== "") {
            currentTimerAvatarWinner = "";
            timerWidget.style.background = "";
            if (timeRemaining <= 60 && timeRemaining > 0) {
                const hue = (timeRemaining / 60) * 140;
                timerWidget.style.background = `linear-gradient(135deg, hsl(${hue}, 80%, 30%), hsl(${hue}, 80%, 50%))`;
            }
          }
        }
      }

      function setTimerProgress(percent) {
        const offset = circumference - (percent / 100) * circumference;
        ringCircle.style.strokeDashoffset = offset;
      }

      function updateTimerDisplay() {
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timeDisplay.innerText = "TIME'S UP!";
          timeDisplay.style.fontSize = "2.5rem";
          const secsLabel = document.getElementById('secsLabel');
          if (secsLabel) secsLabel.style.opacity = '0';
          setTimerProgress(0);
          sendToStreamerBot("timedout");
          playTimeout();
          return;
        }

        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;

        if (timeRemaining > 60) {
          timerWidget.className = "timer-widget state-standard";
          timerWidget.style.background = "";
          timeDisplay.style.fontSize = "";
          const secsLabel = document.getElementById('secsLabel');
          if (secsLabel) secsLabel.style.opacity = '';
          progressRing.classList.remove("visible");
          timeDisplay.innerText = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        } else {
          progressRing.classList.add("visible");
          timeDisplay.innerText = seconds.toString().padStart(2, "0");
          timeDisplay.style.fontSize = "";
          const secsLabel = document.getElementById('secsLabel');
          if (secsLabel) secsLabel.style.opacity = '';

          const hue = (timeRemaining / 60) * 140;
          timerWidget.style.background = `linear-gradient(135deg, hsl(${hue}, 80%, 30%), hsl(${hue}, 80%, 50%))`;

          const percent = (timeRemaining / 60) * 100;
          setTimerProgress(percent);

          if (timeRemaining <= 10) {
            timerWidget.className = "timer-widget state-stopwatch state-danger";
          } else {
            timerWidget.className = "timer-widget state-stopwatch";
          }
        }
      }

      function startTimer(durationMinutes) {
        clearInterval(timerInterval);
        totalSeconds = durationMinutes * 60;
        timeRemaining = totalSeconds;

        updateTimerDisplay();

        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();
        }, 1000);
      }

      function stopTimer() {
        clearInterval(timerInterval);
      }

      function resetTimer(durationMinutes = 0) {
        clearInterval(timerInterval);
        timeRemaining = durationMinutes * 60;
        currentTimerAvatarWinner = "";
        timerWidget.className = "timer-widget state-standard";
        timerWidget.style.background = "";
        timeDisplay.style.fontSize = "";
        progressRing.classList.remove("visible");
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        timeDisplay.innerText = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
      }

      function sendToStreamerBot(status) {
        try {
          const tempWs = new WebSocket(WS_URL);
          tempWs.onopen = () => {
            tempWs.send(
              JSON.stringify({
                request: "DoAction",
                action: { name: "Timer Finished" },
                id: "timer-finished-trigger",
              }),
            );
            tempWs.close();
          };
        } catch (e) {
          console.log(`Action triggered: Timer Finished.`);
        }
      }

      // --- LEADERBOARD LOGIC ---
      function renderLeaderboard(scoresArray) {
        lbListContainer.innerHTML = "";

        if (scoresArray.length === 0) {
          lbListContainer.innerHTML =
            '<div class="empty-state">No scores yet!</div>';
          return;
        }

        const topPlayers = scoresArray.slice(0, MAX_PLAYERS_TO_SHOW);

        topPlayers.forEach((player, index) => {
          const rank = index + 1;
          const row = document.createElement("div");
          row.className = `score-row`;

          let colorStyle = "";
          if (player.color) {
              colorStyle = `style="color: ${player.color};"`;
          }

          row.innerHTML = `
                    <div class="username">
                        <span style="opacity: 0.6; font-size: 0.9em; margin-right: 4px;">#${rank}</span>
                        <img class="avatar" src="" alt="avatar" style="display: none;">
                        <span ${colorStyle}>${player.user}</span>
                    </div>
                    <div class="score-value">${player.score}</div>
                `;

          lbListContainer.appendChild(row);

          // Fetch avatar
          fetch(`https://decapi.me/twitch/avatar/${player.user}`)
            .then((res) => res.text())
            .then((url) => {
              if (url && url.startsWith("http")) {
                const img = row.querySelector(".avatar");
                if (img) {
                  img.src = url;
                  img.style.display = "inline-block";
                }
              }
            })
            .catch((err) => console.error("Error fetching avatar:", err));
        });
      }

      // --- CLUE LOGIC ---
      function updateClueUI(state, guest, clue, winner, answer) {
        clueTitle.className = "clue-title";
        const safeState = state
          ? String(state).trim().toLowerCase()
          : "inactive";
        const safeGuest = guest ? String(guest).trim() : "";

        if (safeState === "inactive") {
          clueTitle.innerHTML = `Mods: Start game with <span style="color: var(--yellow);">!giveword @user</span>`;
          stylusLabel.innerHTML = "";
          clueDisplay.innerHTML = "";
        } else if (safeState === "waiting") {
          clueTitle.classList.add("waiting");
          clueTitle.innerHTML = `Waiting for ${safeGuest}<br>to lock in a secret word...`;
          stylusLabel.innerHTML = "";
          clueDisplay.innerHTML = "";
        } else if (safeState === "active") {
          clueTitle.classList.add("active");
          clueTitle.innerHTML = "Guess ONE-WORD answers in chat!";
          stylusLabel.innerHTML = `Clues from ${safeGuest}`;
          clueDisplay.innerHTML = clue ? clue : "";
        } else if (safeState === "recap") {
          clueTitle.classList.add("waiting");
          const safeWinner = winner ? String(winner).trim() : '';
          const safeAnswer = answer ? String(answer).trim() : '';

          let titleHtml = '';
          if (safeWinner) {
              if (safeWinner.toLowerCase().includes('forfeited')) {
                  titleHtml = safeWinner;
              } else if (safeWinner.toLowerCase() === "time's up") {
                  titleHtml = "TIME'S UP! No one guessed it.";
              } else {
                  titleHtml = `WINNER: ${safeWinner}`;
              }
          } else {
              titleHtml = 'Round Over!';
          }

          if (safeAnswer) {
              if (titleHtml !== 'Round Over!') {
                  titleHtml += `<br>The secret word was ${safeAnswer}!`;
              } else {
                  titleHtml = `The secret word was ${safeAnswer}!`;
              }
          }

          clueTitle.innerHTML = titleHtml;
          stylusLabel.innerHTML = `Clues were from&nbsp;<span style="color: var(--orange);">${safeGuest}</span>`;
          clueDisplay.innerHTML = clue ? clue : "";
        }
      }

      // --- WEBSOCKET HANDLERS ---
      function requestGlobals() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              request: "GetGlobals",
              id: REQUEST_ID + "_persisted",
              persisted: true,
            }),
          );
        }
      }

      function getVarValue(v) {
        if (v == null) return null;
        if (typeof v === "object" && v !== null && "value" in v) return v.value;
        return v;
      }

      function processVariables(variablesObj) {
        // 1. Process Leaderboard
        const scoresVal = getVarValue(variablesObj[VAR_SCORES]);
        if (scoresVal != null) {
          const rawValue = scoresVal;
          const stringifiedValue =
            typeof rawValue === "object"
              ? JSON.stringify(rawValue)
              : String(rawValue);

          if (stringifiedValue !== currentScoresString) {
            currentScoresString = stringifiedValue;
            try {
              let parsedData =
                typeof rawValue === "object" ? rawValue : JSON.parse(rawValue);
              if (typeof parsedData === "string")
                parsedData = JSON.parse(parsedData);

              let scoresArray = [];
              if (Array.isArray(parsedData)) {
                scoresArray = parsedData.map((item) => ({
                  user: item.username,
                  score: parseInt(item.score) || 0,
                  color: item.color
                }));
              } else {
                for (const [user, score] of Object.entries(parsedData)) {
                  scoresArray.push({ user: user, score: parseInt(score) || 0 });
                }
              }

              scoresArray.sort((a, b) => b.score - a.score);
              renderLeaderboard(scoresArray);
            } catch (e) {
              console.error("Failed to parse scores JSON:", e);
            }
          }
        }

        // 2. Process Clue & State
        let previousGameState = currentGameState;
        const stateVal = getVarValue(variablesObj[VAR_STATE]);
        if (stateVal != null) currentGameState = stateVal;

        const guestVal = getVarValue(variablesObj[VAR_GUEST]);
        if (guestVal != null) currentGameGuest = guestVal;

        const clueVal = getVarValue(variablesObj[VAR_CLUE]);
        if (clueVal != null) currentGameClue = clueVal;

        // 3. Process Timer State
        let newTimerStatus = currentTimerStatus;
        let newTimerDuration = currentTimerDuration;

        const tsVal = getVarValue(variablesObj[VAR_TIMER_STATUS]);
        if (tsVal != null) {
          newTimerStatus = String(tsVal).trim().toLowerCase();
        }

        const tdVal = getVarValue(variablesObj[VAR_TIMER_DURATION]);
        if (tdVal != null) {
          newTimerDuration = parseInt(tdVal) || 2;
        }

        let durationChanged = newTimerDuration !== currentTimerDuration;

        if (newTimerStatus !== currentTimerStatus || durationChanged) {
          if (newTimerStatus === "running" && currentTimerStatus !== "running") {
            startTimer(newTimerDuration);
          } else if (newTimerStatus === "stopped" && currentTimerStatus !== "stopped") {
            stopTimer();
          } else if (newTimerStatus === "timedout" && currentTimerStatus !== "timedout") {
             // Timer widget handles its own timeout UI, we just need to track state to avoid re-triggering start/stop
          }
          currentTimerStatus = newTimerStatus;
          currentTimerDuration = newTimerDuration;
        }

        let currentState = String(currentGameState).trim().toLowerCase();
        if (currentState === "inactive") {
          timerWidget.style.display = 'none';
        } else {
          timerWidget.style.display = '';
        }

        if ((currentState === "waiting" && previousGameState !== "waiting") ||
            (currentState === "waiting" && durationChanged)) {
          resetTimer(newTimerDuration);
        }

        // 4. Process Winner & Answer Variables
        let newWinner = currentWinner;
        let newAnswer = currentAnswer;

        const winVal = getVarValue(variablesObj[VAR_WINNER]);
        if (winVal != null) {
          newWinner = String(winVal).trim();
        }

        const ansVal = getVarValue(variablesObj[VAR_ANSWER]);
        if (ansVal != null) {
          newAnswer = String(ansVal).trim();
        }

        if (currentState !== "recap") {
          currentWinner = "";
          currentAnswer = "";
        } else if (newWinner !== currentWinner || newAnswer !== currentAnswer) {
          if (newWinner !== currentWinner) {
            if (newWinner !== "" && newWinner.toLowerCase() !== "time's up" && !newWinner.toLowerCase().includes("forfeited")) {
              playSuccess();
            }
          }
          currentWinner = newWinner;
          currentAnswer = newAnswer;
        }

        updateClueUI(currentGameState, currentGameGuest, currentGameClue, currentWinner, currentAnswer);
        updateTimerAvatar(currentGameState, currentWinner);
      }

      function connect() {
        try {
          ws = new WebSocket(WS_URL);

          ws.onopen = () => {
            console.log("Connected to Streamer.bot");

            // Subscribe to global variable changes for timer events
            ws.send(
              JSON.stringify({
                request: "Subscribe",
                events: { general: ["Custom"] },
                id: "integrated-listener",
              }),
            );

            requestGlobals();
            pollInterval = setInterval(requestGlobals, POLL_INTERVAL_MS);
          };

          ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            // Handle variable polling
            if (
              msg.id === REQUEST_ID + "_persisted" &&
              msg.variables
            ) {
              processVariables(msg.variables);
            }

            // Handle custom events (Timer)
            if (
              msg.event?.source === "General" &&
              msg.event?.type === "Custom"
            ) {
              if (msg.data?.name === "GameStart") {
                const duration =
                  msg.data.arguments["guessing-game_timerDuration"] || 2;
                const secretWord =
                  msg.data.arguments["guessing-game_secretWord"];

                if (secretWord && secretWord.trim() !== "") {
                  startTimer(parseInt(duration));
                }
              } else if (msg.data?.name === "GameStop") {
                resetTimer();
              }
            }
          };

          ws.onclose = () => {
            console.log("Disconnected from Streamer.bot. Reconnecting...");
            clearInterval(pollInterval);
            setTimeout(connect, 5000);
          };

          ws.onerror = (error) => {
            ws.close();
          };
        } catch (error) {
          console.warn("WebSocket creation failed.", error);
        }
      }

      // Initialize
      updateClueUI("inactive", "", "", "", "");
      connect();
    </script>
  </body>
</html>
