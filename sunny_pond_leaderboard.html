<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game Leaderboard</title>
    <style>
        :root {
            /* Sunny Pond Palette */
            --cyan-light: #ecfeff;
            --cyan: #06b6d4;
            --teal-bright: #2dd4bf;
            --teal-dark: #115e59;
            --yellow: #facc15;
            --orange: #ea580c;
            --cyan-neon: #43d9f2;
            --red-accent: #f24343;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent; /* Essential for OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--cyan-light);
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 20px;
        }

        /* Leaderboard Widget Container */
        .leaderboard-widget {
            background: rgba(24, 24, 27, 0.9); /* Same background color as Twitch dark mode */
            border: 4px solid var(--cyan);
            border-radius: 16px;
            min-width: 300px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: transparent;
            padding: 10px 15px 5px 15px;
            text-align: center;
        }

        .header h2 {
            color: var(--cyan-light);
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Leaderboard List */
        .list-container {
            padding: 5px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 80px;
        }

        /* Individual Rows */
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            transition: transform 0.2s ease;
        }

        .username {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--cyan-light);
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--cyan);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .score-value {
            color: var(--cyan-light);
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            color: var(--cyan-light);
            opacity: 0.7;
            font-style: italic;
            padding: 20px 0;
            font-size: 1rem;
        }

        /* Hidden Simulation Panel - Hide in OBS with CSS */
        #control-panel {
            background: var(--cyan-light);
            padding: 15px;
            border-radius: 10px;
            color: #333;
            font-size: 14px;
            border: 2px solid var(--orange);
            min-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sim-header {
            font-weight: bold;
            color: var(--teal-dark);
            text-align: center;
            margin-bottom: 5px;
        }

        button {
            background: var(--orange);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background: var(--teal-bright);
            color: var(--teal-dark);
        }

        /* Connection indicator */
        #connection-status {
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
        }
        .connected { color: var(--teal-dark); }
        .disconnected { color: var(--red-accent); }

    </style>
</head>
<body>

    <div class="leaderboard-widget">
        <div class="header">
            <h2>LEADERBOARD</h2>
        </div>
        <div class="list-container" id="leaderboard-list">
            <div class="empty-state">Waiting for scores...</div>
        </div>
    </div>

    <!-- Simulation Panel for Browser Testing -->
    <div id="control-panel">
        <div class="sim-header">Browser Simulation Panel</div>
        <div id="connection-status" class="disconnected">WS Disconnected</div>
        <button onclick="startMockPreview()">Simulate Live Data</button>
        <div style="font-size: 0.7rem; text-align: center; opacity: 0.8; margin-top: 5px;">
            Hide in OBS Custom CSS: <br> <code>#control-panel { display: none !important; }</code>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const WS_URL = 'ws://127.0.0.1:8080/';
        const POLL_INTERVAL_MS = 2000; // Poll every 2 seconds
        const REQUEST_ID = 'guessing_game_leaderboard_poll';

        // The name of the global variable containing the bundled JSON object of scores
        const VAR_SCORES = 'guessing-game_leaderboard';
        const MAX_PLAYERS_TO_SHOW = 5; // Limit the list size so it doesn't run off-screen
        // ---------------------

        let ws;
        let pollInterval;
        let currentScoresString = ""; // Cache to prevent unnecessary DOM updates
        let mockIntervalActive = false;

        const listContainer = document.getElementById('leaderboard-list');
        const connStatus = document.getElementById('connection-status');

        function connect() {
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    connStatus.textContent = 'Connected to Streamer.bot';
                    connStatus.className = 'connected';
                    requestGlobals();
                    pollInterval = setInterval(requestGlobals, POLL_INTERVAL_MS);
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    // Listen for both our persisted and non-persisted requests
                    if (data.id === REQUEST_ID + '_persisted' && data.variables) {
                        processScores(data.variables);
                    }
                };

                ws.onclose = () => {
                    connStatus.textContent = 'Disconnected';
                    connStatus.className = 'disconnected';
                    clearInterval(pollInterval);
                    // Don't auto-reconnect if they are using the simulation panel
                    if (!mockIntervalActive) {
                        setTimeout(connect, 5000);
                    }
                };

                ws.onerror = (error) => {
                    // This catches the asynchronous connection refused error when not in OBS
                    ws.close();
                };
            } catch (error) {
                console.warn("WebSocket creation failed.");
            }
        }

        function requestGlobals() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ request: "GetGlobals", id: REQUEST_ID + '_persisted', persisted: true }));
            }
        }

        function processScores(variablesObj) {
            if (!variablesObj[VAR_SCORES] || variablesObj[VAR_SCORES].value == null) return;

            const rawValue = variablesObj[VAR_SCORES].value;
            const stringifiedValue = typeof rawValue === 'object' ? JSON.stringify(rawValue) : String(rawValue);

            if (stringifiedValue === currentScoresString) return;
            currentScoresString = stringifiedValue;

            let parsedData = {};
            try {
                if (typeof rawValue === 'object') {
                    parsedData = rawValue;
                } else {
                    parsedData = JSON.parse(rawValue);
                    if (typeof parsedData === 'string') parsedData = JSON.parse(parsedData);
                }
            } catch (e) {
                console.error("Failed to parse scores JSON:", e);
                return;
            }

            let scoresArray = [];
            if (Array.isArray(parsedData)) {
                scoresArray = parsedData.map(item => ({ user: item.username, score: parseInt(item.score) || 0, color: item.color }));
            } else {
                for (const [user, score] of Object.entries(parsedData)) {
                    scoresArray.push({ user: user, score: parseInt(score) || 0 });
                }
            }

            scoresArray.sort((a, b) => b.score - a.score);
            renderLeaderboard(scoresArray);
        }

        function renderLeaderboard(scoresArray) {
            listContainer.innerHTML = '';

            if (scoresArray.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No scores yet!</div>';
                return;
            }

            const topPlayers = scoresArray.slice(0, MAX_PLAYERS_TO_SHOW);

            topPlayers.forEach((player, index) => {
                const rank = index + 1;
                const row = document.createElement('div');
                row.className = `score-row`;

                let colorStyle = "";
                if (player.color) {
                    colorStyle = `style="color: ${player.color};"`;
                }

                row.innerHTML = `
                    <div class="username">
                        <span style="opacity: 0.6; font-size: 0.9em; margin-right: 4px;">#${rank}</span>
                        <img class="avatar" src="" alt="avatar" style="display: none;">
                        <span ${colorStyle}>${player.user}</span>
                    </div>
                    <div class="score-value">${player.score}</div>
                `;

                listContainer.appendChild(row);

                // Fetch avatar
                fetch(`https://decapi.me/twitch/avatar/${player.user}`)
                  .then((res) => res.text())
                  .then((url) => {
                    if (url && url.startsWith("http")) {
                      const img = row.querySelector(".avatar");
                      if (img) {
                        img.src = url;
                        img.style.display = "inline-block";
                      }
                    }
                  })
                  .catch((err) => console.error("Error fetching avatar:", err));
            });
        }

        function startMockPreview() {
            if (mockIntervalActive) return; // Prevent multiple intervals
            mockIntervalActive = true;

            connStatus.textContent = 'Simulation Mode Active';
            connStatus.className = 'connected';

            // Disconnect websocket so it stops trying to reconnect
            if (ws) { ws.onclose = null; ws.close(); }

            let mockScores = [
                { username: "MegaDuck", score: 1250 },
                { username: "GooseMaster", score: 980 },
                { username: "QuackAttaque", score: 850 },
                { username: "BreadCrumbz", score: 720 },
                { username: "SirFeathers", score: 600 },
                { username: "PondSkater", score: 150 }
            ];

            let variablesObj = {};
            variablesObj[VAR_SCORES] = { value: JSON.stringify(mockScores) };
            processScores(variablesObj);

            setInterval(() => {
                const randomIdx = Math.floor(Math.random() * mockScores.length);
                mockScores[randomIdx].score += Math.floor(Math.random() * 200) + 50;
                variablesObj[VAR_SCORES] = { value: JSON.stringify(mockScores) };
                processScores(variablesObj);
            }, 3000);
        }

        // Start connection on load
        connect();
    </script>
</body>
</html>
